name: collect-and-deploy
on:
  schedule:
    - cron: "0 22 * * 0-4"     # 평일 07:00 KST: 시세 + 대용가 + 수시공시 델타(daily)
    - cron: "10 15 * * *"      # 매일 00:10 KST: catchup(미수집분 mezz→biz→fin→kpi→quarters, 한도까지)
    - cron: "30 20 2 * *"      # 매월 2일 05:30 KST: 재무(연간+최근분기)
    - cron: "30 20 1,15 * *"   # 매월 1일·15일 05:30 KST: 신용등급
    - cron: "0 19 * * 1,4"     # 매주 화·금 04:00 KST: 뉴스
    - cron: "0 20 5 4 *"       # 4/5 05:00 KST: 사업내용·감사의견·주주 (사업보고서)
  workflow_dispatch:
    inputs:
      job:
        description: "run.py job"
        default: "price"
        type: choice
        options: [init, fin, kpi, biz, mezz, price, rating, news, summarize, site, all, delta, daily, catchup, unlisted, quarters, subst]
      args:
        description: "추가 인자 (예: --years 2024 2025 / --limit 50 / --market KOSPI KONEX --new-only / unlisted: --type 기업신용평가)"
        default: ""
      restore_run:
        description: "이전 실행의 DB 아티팩트로 복원 (run id, 선택)"
        default: ""
concurrency:
  # DB를 쓰는 작업은 한 번에 하나(뒤 실행은 대기). unlisted(드라이런, DB 읽기만)는 별도 그룹이라 병렬 실행 가능
  group: ${{ github.event.inputs.job == 'unlisted' && 'kosdaq-ro' || 'kosdaq-db' }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # DB는 저장소가 아니라 Actions 아티팩트(kosdaq-db, 90일 보관)에만 둔다 — GitHub 100MB 파일 제한 때문.
      # 매 실행: 지정 run 또는 가장 최근 '성공' 실행의 아티팩트를 받아 이어서 작업하고 다시 올린다.
      - name: restore db            # 1순위 R2(kosdaq-db/kosdaq.db.gz), restore_run 지정 시 그 아티팩트, 둘 다 없으면 최근 성공 아티팩트
        env:
          GH_TOKEN: "${{ github.token }}"
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # R2 호환(최신 aws cli 체크섬 헤더 회피)
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_EP: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          RID="${{ github.event.inputs.restore_run }}"; SRC=""
          if [ -n "$RID" ]; then
            gh run download $RID -n kosdaq-db -D . && SRC="artifact $RID"
          elif [ -n "$AWS_ACCESS_KEY_ID" ] && aws s3 cp "s3://$R2_BUCKET/kosdaq.db.gz" . --endpoint-url "$R2_EP" --only-show-errors; then
            SRC="R2"
          else
            for id in $(gh run list -w collect.yml -s success -L 15 --json databaseId -q '.[].databaseId'); do
              if gh run download $id -n kosdaq-db -D . 2>/dev/null; then SRC="artifact $id"; break; fi
            done
          fi
          if [ -f kosdaq.db.gz ] && [ ! -f kosdaq.db ]; then gunzip -f kosdaq.db.gz; fi
          echo "복원 출처: ${SRC:-없음(새 DB)}"; ls -la kosdaq.db* || true
          # 무결성 점검 → 손상 시 .recover 복구 → 그래도 실패면 R2 일자별 백업(최신순) → 아티팩트 순으로 대체
          if [ -f kosdaq.db ] && ! python dbcheck.py recover kosdaq.db; then
            echo "::warning::복원 DB 손상 — 백업으로 대체 시도"; rm -f kosdaq.db
            for key in $(aws s3 ls "s3://$R2_BUCKET/backup/" --endpoint-url "$R2_EP" 2>/dev/null | awk '{print $4}' | sort -r); do
              aws s3 cp "s3://$R2_BUCKET/backup/$key" kosdaq.db.gz --endpoint-url "$R2_EP" --only-show-errors && gunzip -f kosdaq.db.gz
              if python dbcheck.py recover kosdaq.db; then echo "백업 사용: $key"; break; else rm -f kosdaq.db; fi
            done
            if [ ! -f kosdaq.db ]; then
              for id in $(gh run list -w collect.yml -s success -L 30 --json databaseId -q '.[].databaseId'); do
                if gh run download $id -n kosdaq-db -D . 2>/dev/null; then gunzip -f kosdaq.db.gz; python dbcheck.py recover kosdaq.db && { echo "아티팩트 사용: $id"; break; } || rm -f kosdaq.db; fi
              done
            fi
          fi
      - name: collect
        env:
          PYTHONUNBUFFERED: "1"
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 20 2 * *") JOB=fin ;;
              "30 20 1,15 * *") JOB=rating ;;
              "0 19 * * 1,4") JOB=news ;;
              "0 20 5 4 *")  JOB=biz ;;
              "10 15 * * *")  JOB=catchup ;;
              *)             JOB=daily ;;
            esac
            timeout --signal=INT 170m python run.py $JOB || echo "::warning::수집 종료 코드 $? (170분 제한 또는 오류) — 저장된 범위까지 보관"
          else
            timeout --signal=INT 170m python run.py ${{ github.event.inputs.job || 'price' }} ${{ github.event.inputs.args }} || echo "::warning::수집 종료 코드 $? (170분 제한 또는 오류) — 저장된 범위까지 보관"
          fi
      - name: keep dry-run outputs      # unlisted 드라이런 명단 등 산출물
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: outputs, path: "unlisted_candidates.*", if-no-files-found: ignore, retention-days: 30 }
      - name: pack db
        if: always() && github.event.inputs.job != 'unlisted'
        run: |
          if python dbcheck.py pack kosdaq.db; then
            rm -f kosdaq.db.gz; gzip -6 -c kosdaq.db > kosdaq.db.gz; ls -la kosdaq.db.gz; echo "DB_OK=1" >> $GITHUB_ENV
          else
            echo "::error::DB 무결성 실패 — 이번 실행 결과는 업로드하지 않음(이전 본 유지)"; echo "DB_OK=0" >> $GITHUB_ENV
          fi
      - name: keep db (R2)           # 최신본 kosdaq.db.gz + 일자별 백업(backup/, 14일 보관). R2 미설정 시 아티팩트로 대체
        if: always() && github.event.inputs.job != 'unlisted'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # R2 호환(최신 aws cli 체크섬 헤더 회피)
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_EP: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "R2 미설정 — 아티팩트만 사용"; echo "R2=0" >> $GITHUB_ENV; exit 0; fi
          if [ "$DB_OK" != "1" ]; then echo "무결성 실패분은 올리지 않음"; echo "R2=1" >> $GITHUB_ENV; exit 0; fi
          aws s3 cp kosdaq.db.gz "s3://$R2_BUCKET/kosdaq.db.gz" --endpoint-url "$R2_EP" --only-show-errors
          D=$(TZ=Asia/Seoul date +%Y%m%d)                      # 하루 1개(같은 날은 덮어씀) × 14일 보관 → 용량 상한 ≈ 14 × DB 크기
          aws s3 cp kosdaq.db.gz "s3://$R2_BUCKET/backup/kosdaq-$D.db.gz" --endpoint-url "$R2_EP" --only-show-errors
          CUT=$(TZ=Asia/Seoul date -d '14 days ago' +%Y%m%d)
          aws s3 ls "s3://$R2_BUCKET/backup/" --endpoint-url "$R2_EP" | awk '{print $4}' | while read f; do
            d=$(echo "$f" | sed -E 's/kosdaq-([0-9]{8}).*/\1/'); if [ -n "$d" ] && [ "$d" -lt "$CUT" ]; then aws s3 rm "s3://$R2_BUCKET/backup/$f" --endpoint-url "$R2_EP"; fi
          done || true
          echo "R2 저장 완료: kosdaq.db.gz, backup/kosdaq-$D.db.gz"; echo "R2=1" >> $GITHUB_ENV
      - name: keep db artifact (R2 미설정 시 대체)
        if: always() && env.R2 != '1' && env.DB_OK == '1'
        uses: actions/upload-artifact@v4
        with: { name: kosdaq-db, path: kosdaq.db.gz, retention-days: 90, compression-level: 0 }
      - name: prune old db artifacts   # R2 전환 후 남은 아티팩트 정리(최신 1개만)
        if: always() && github.event.inputs.job != 'unlisted'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=kosdaq-db&per_page=100" -q '.artifacts[] | "\(.id) \(.created_at)"' \
            | sort -k2 -r | tail -n +2 | while read id dt; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "삭제 $id ($dt)"; done || true
      - name: build site
        if: github.event.inputs.job != 'unlisted'
        run: python run.py site
      - name: ensure pages project
        if: github.event.inputs.job != 'unlisted'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create kosdaq-db --production-branch=main
      - name: deploy
        if: github.event.inputs.job != 'unlisted'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name kosdaq-db
