name: collect-and-deploy
on:
  schedule:
    - cron: "0 21 * * 0-4"     # 평일 06:00 KST: 시세 + 수시공시 델타(daily, 대용가 포함)
    - cron: "30 21 * * 0-4"    # 평일 06:30 KST: 대용가(subst) 재조회 — 당일 대용가 확정분
    - cron: "30 23 * * 0-4"    # 평일 08:30 KST: daily 보완 실행(06:00에 KRX 전일 시세가 미집계였을 때; 받은 날짜는 건너뜀)
    - cron: "10 15 * * *"      # 매일 00:10 KST: catchup(미수집분 mezz→biz→fin→kpi→quarters, 한도까지)
    - cron: "30 20 2 * *"      # 매월 2일 05:30 KST: 재무(연간+최근분기)
    - cron: "30 20 1,15 * *"   # 매월 1일·15일 05:30 KST: 신용등급
    - cron: "0 19 * * 1,4"     # 매주 화·금 04:00 KST: 뉴스
    - cron: "0 20 5 4 *"       # 4/5 05:00 KST: 사업내용·감사의견·주주 (사업보고서)
  workflow_dispatch:
    inputs:
      job:
        description: "run.py job"
        default: "price"
        type: choice
        options: [init, fin, kpi, biz, mezz, price, rating, news, summarize, site, all, delta, daily, catchup, unlisted, quarters, subst, fin_fast, rating_fix, da, chain, fin_ofs, fin_yoy, notes_struct, newlist, notes, invest, da_notes]
      args:
        description: "추가 인자 (예: --years 2024 2025 / --limit 50 / --market KOSPI KONEX --new-only / unlisted: --type 기업신용평가)"
        default: ""
      restore_run:
        description: "이전 실행의 DB 아티팩트로 복원 (run id, 선택)"
        default: ""
      restore_key:
        description: "R2 백업 키로 복원 (예: backup/kosdaq-20261022.db.gz 또는 weekly/kosdaq-20261019.db.gz, 선택) — 복원 후 최신본으로 다시 올림"
        default: ""
concurrency:
  # DB를 쓰는 작업은 한 번에 하나(뒤 실행은 대기). unlisted(드라이런, DB 읽기만)는 별도 그룹이라 병렬 실행 가능
  group: ${{ github.event.inputs.job == 'unlisted' && 'kosdaq-ro' || 'kosdaq-db' }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: { contents: read, actions: write }   # chain 자동 이어하기(gh workflow run)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # DB는 저장소가 아니라 Actions 아티팩트(kosdaq-db, 90일 보관)에만 둔다 — GitHub 100MB 파일 제한 때문.
      # 매 실행: 지정 run 또는 가장 최근 '성공' 실행의 아티팩트를 받아 이어서 작업하고 다시 올린다.
      - name: restore db            # 1순위 R2(kosdaq-db/kosdaq.db.gz), restore_run 지정 시 그 아티팩트, 둘 다 없으면 최근 성공 아티팩트
        env:
          GH_TOKEN: "${{ github.token }}"
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # R2 호환(최신 aws cli 체크섬 헤더 회피)
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_EP: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          RID="${{ github.event.inputs.restore_run }}"; RKEY="${{ github.event.inputs.restore_key }}"; SRC=""
          r2get() { for i in 1 2 3 4; do aws s3 cp "s3://$R2_BUCKET/$1" kosdaq.db.gz --endpoint-url "$R2_EP" --only-show-errors && return 0; echo "R2 다운로드 실패($i/4): $1 — 20초 후 재시도"; rm -f kosdaq.db.gz; sleep 20; done; return 1; }
          if [ -n "$RKEY" ]; then
            r2get "$RKEY" && SRC="R2 $RKEY" || { echo "::error::지정 백업($RKEY) 복원 실패"; exit 1; }
          elif [ -n "$RID" ]; then
            gh run download $RID -n kosdaq-db -D . && SRC="artifact $RID"
          elif [ -n "$AWS_ACCESS_KEY_ID" ]; then
            if r2get kosdaq.db.gz; then SRC="R2"
            else
              echo "::warning::최신본 복원 실패 — 일자별 백업(최신순)으로 대체"
              for key in $(aws s3 ls "s3://$R2_BUCKET/backup/" --endpoint-url "$R2_EP" 2>/dev/null | awk '{print $4}' | sort -r | head -5); do
                r2get "backup/$key" && { SRC="R2 backup/$key"; break; }
              done
              if [ -z "$SRC" ]; then for key in $(aws s3 ls "s3://$R2_BUCKET/weekly/" --endpoint-url "$R2_EP" 2>/dev/null | awk '{print $4}' | sort -r | head -3); do
                r2get "weekly/$key" && { SRC="R2 weekly/$key"; break; }
              done; fi
            fi
          else
            for id in $(gh run list -w collect.yml -s success -L 15 --json databaseId -q '.[].databaseId'); do
              if gh run download $id -n kosdaq-db -D . 2>/dev/null; then SRC="artifact $id"; break; fi
            done
          fi
          if [ -f kosdaq.db.gz ] && [ ! -f kosdaq.db ]; then gunzip -f kosdaq.db.gz; fi
          # 안전장치(2026-10-23 사고 재발 방지): init 외 작업은 DB가 없으면 중단 — 빈 DB로 수집·업로드·배포하면 최신본이 덮인다
          if [ ! -f kosdaq.db ] && [ "${{ github.event.inputs.job }}" != "init" ]; then echo "::error::DB 복원 실패 — 중단(빈 DB로 진행하지 않음)"; exit 1; fi
          # 대용가: 자택 Mac(국내 IP)이 올린 subst/latest.json (러너는 KRX 직접 호출이 400으로 막힘)
          [ -n "$AWS_ACCESS_KEY_ID" ] && aws s3 cp "s3://$R2_BUCKET/subst/latest.json" subst_latest.json --endpoint-url "$R2_EP" --only-show-errors 2>/dev/null || echo "subst/latest.json 없음"
          echo "복원 출처: ${SRC:-없음(새 DB)}"; ls -la kosdaq.db* || true
          # 무결성 점검 → 손상 시 .recover 복구 → 그래도 실패면 R2 일자별 백업(최신순) → 아티팩트 순으로 대체
          if [ -f kosdaq.db ] && ! python dbcheck.py recover kosdaq.db; then
            echo "::warning::복원 DB 손상 — 백업으로 대체 시도"; rm -f kosdaq.db
            for key in $(aws s3 ls "s3://$R2_BUCKET/backup/" --endpoint-url "$R2_EP" 2>/dev/null | awk '{print $4}' | sort -r); do
              aws s3 cp "s3://$R2_BUCKET/backup/$key" kosdaq.db.gz --endpoint-url "$R2_EP" --only-show-errors && gunzip -f kosdaq.db.gz
              if python dbcheck.py recover kosdaq.db; then echo "백업 사용: $key"; break; else rm -f kosdaq.db; fi
            done
            if [ ! -f kosdaq.db ]; then
              for id in $(gh run list -w collect.yml -s success -L 30 --json databaseId -q '.[].databaseId'); do
                if gh run download $id -n kosdaq-db -D . 2>/dev/null; then gunzip -f kosdaq.db.gz; python dbcheck.py recover kosdaq.db && { echo "아티팩트 사용: $id"; break; } || rm -f kosdaq.db; fi
              done
            fi
          fi
      - name: sanity check            # 회사 수 1,000 미만이면 손상·빈 DB로 보고 중단(init 제외)
        if: github.event.inputs.job != 'init'
        run: |
          N=$(python -c "import sqlite3;print(sqlite3.connect('kosdaq.db').execute('select count(*) from company').fetchone()[0])" 2>/dev/null || echo 0)
          echo "회사 수: $N"; if [ "$N" -lt 1000 ]; then echo "::error::DB 회사 수 $N — 비정상, 중단"; exit 1; fi
          echo "DB_SANE=1" >> $GITHUB_ENV
      - name: collect
        env:
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Seoul                         # 러너는 UTC — 날짜 판단(오늘·전일·공시 기간)을 한국시간으로
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}            # KRX Data Marketplace 로그인(대용가 전종목 조회용, 선택)
          KRX_PW: ${{ secrets.KRX_PW }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}     # chain: 단계마다 사이트 중간 반영(wrangler)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 20 2 * *") JOB=fin ;;
              "30 20 1,15 * *") JOB=rating ;;
              "0 19 * * 1,4") JOB=news ;;
              "0 20 5 4 *")  JOB=biz ;;
              "10 15 * * *")  JOB=catchup ;;
              "30 21 * * 0-4") JOB=subst ;;
              *)             JOB=daily ;;
            esac
            timeout --signal=INT 170m python run.py $JOB || echo "::warning::수집 종료 코드 $? (170분 제한 또는 오류) — 저장된 범위까지 보관"
          else
            timeout --signal=INT 170m python run.py ${{ github.event.inputs.job || 'price' }} ${{ github.event.inputs.args }} || echo "::warning::수집 종료 코드 $? (170분 제한 또는 오류) — 저장된 범위까지 보관"
          fi
      - name: keep dry-run outputs      # unlisted 드라이런 명단 등 산출물
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: outputs, path: "unlisted_candidates.*", if-no-files-found: ignore, retention-days: 30 }
      - name: pack db
        if: always() && github.event.inputs.job != 'unlisted' && (env.DB_SANE == '1' || github.event.inputs.job == 'init')
        run: |
          N=$(python -c "import sqlite3;print(sqlite3.connect('kosdaq.db').execute('select count(*) from company').fetchone()[0])" 2>/dev/null || echo 0)
          if [ "$N" -lt 1000 ] && [ "${{ github.event.inputs.job }}" != "init" ]; then echo "::error::업로드 직전 회사 수 $N — 업로드하지 않음"; echo "DB_OK=0" >> $GITHUB_ENV; exit 0; fi
          if python dbcheck.py pack kosdaq.db; then
            rm -f kosdaq.db.gz; gzip -6 -c kosdaq.db > kosdaq.db.gz; ls -la kosdaq.db.gz; echo "DB_OK=1" >> $GITHUB_ENV
          else
            echo "::error::DB 무결성 실패 — 이번 실행 결과는 업로드하지 않음(이전 본 유지)"; echo "DB_OK=0" >> $GITHUB_ENV
          fi
      - name: keep db (R2)           # 최신본 kosdaq.db.gz + 일자별 백업(backup/, 14일 보관). R2 미설정 시 아티팩트로 대체
        if: always() && github.event.inputs.job != 'unlisted' && env.DB_OK == '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # R2 호환(최신 aws cli 체크섬 헤더 회피)
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_EP: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "R2 미설정 — 아티팩트만 사용"; echo "R2=0" >> $GITHUB_ENV; exit 0; fi
          if [ "$DB_OK" != "1" ]; then echo "무결성 실패분은 올리지 않음"; echo "R2=1" >> $GITHUB_ENV; exit 0; fi
          aws s3 cp kosdaq.db.gz "s3://$R2_BUCKET/kosdaq.db.gz" --endpoint-url "$R2_EP" --only-show-errors
          D=$(TZ=Asia/Seoul date +%Y%m%d)                      # 하루 1개(같은 날은 덮어씀) × 14일 보관 → 용량 상한 ≈ 14 × DB 크기
          aws s3 cp kosdaq.db.gz "s3://$R2_BUCKET/backup/kosdaq-$D.db.gz" --endpoint-url "$R2_EP" --only-show-errors
          CUT=$(TZ=Asia/Seoul date -d '14 days ago' +%Y%m%d)
          aws s3 ls "s3://$R2_BUCKET/backup/" --endpoint-url "$R2_EP" | awk '{print $4}' | while read f; do
            d=$(echo "$f" | sed -nE 's/^kosdaq-([0-9]{8})\.db\.gz$/\1/p'); if [ -n "$d" ] && [ "$d" -lt "$CUT" ]; then aws s3 rm "s3://$R2_BUCKET/backup/$f" --endpoint-url "$R2_EP"; fi
          done || true
          # 주간 백업(2026-10-23 추가): 이번 주 월요일 날짜로 weekly/ 에 1개(주 첫 실행 때만 기록, 그 주엔 덮어쓰지 않음) × 8주 보관 → 일자별 14일 백업으로 못 돌아가는 오래된 오염도 복구 가능
          MON=$(TZ=Asia/Seoul date -d "$D -$(( $(TZ=Asia/Seoul date -d "$D" +%u) - 1 )) days" +%Y%m%d)
          if ! aws s3 ls "s3://$R2_BUCKET/weekly/kosdaq-$MON.db.gz" --endpoint-url "$R2_EP" >/dev/null 2>&1; then
            aws s3 cp kosdaq.db.gz "s3://$R2_BUCKET/weekly/kosdaq-$MON.db.gz" --endpoint-url "$R2_EP" --only-show-errors && echo "주간 백업 기록: weekly/kosdaq-$MON.db.gz"
            WCUT=$(TZ=Asia/Seoul date -d '56 days ago' +%Y%m%d)
            aws s3 ls "s3://$R2_BUCKET/weekly/" --endpoint-url "$R2_EP" | awk '{print $4}' | while read f; do
              d=$(echo "$f" | sed -nE 's/^kosdaq-([0-9]{8})\.db\.gz$/\1/p'); if [ -n "$d" ] && [ "$d" -lt "$WCUT" ]; then aws s3 rm "s3://$R2_BUCKET/weekly/$f" --endpoint-url "$R2_EP"; fi
            done || true
          fi
          echo "R2 저장 완료: kosdaq.db.gz, backup/kosdaq-$D.db.gz"; echo "R2=1" >> $GITHUB_ENV
      - name: keep db artifact (R2 미설정 시 대체)
        if: always() && env.R2 != '1' && env.DB_OK == '1'
        uses: actions/upload-artifact@v4
        with: { name: kosdaq-db, path: kosdaq.db.gz, retention-days: 90, compression-level: 0 }
      - name: prune old db artifacts   # R2 전환 후 남은 아티팩트 정리(최신 1개만)
        if: always() && github.event.inputs.job != 'unlisted'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=kosdaq-db&per_page=100" -q '.artifacts[] | "\(.id) \(.created_at)"' \
            | sort -k2 -r | tail -n +2 | while read id dt; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "삭제 $id ($dt)"; done || true
      - name: build site
        if: github.event.inputs.job != 'unlisted' && env.DB_OK == '1'
        run: python run.py site
      - name: ensure pages project
        if: github.event.inputs.job != 'unlisted' && env.DB_OK == '1'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create kosdaq-db --production-branch=main
      - name: deploy
        if: github.event.inputs.job != 'unlisted' && env.DB_OK == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name kosdaq-db
      - name: auto-continue chain        # 170분 제한으로 끊긴 chain의 남은 단계를 자동으로 다시 실행(최대 8회)
        if: "!cancelled() && hashFiles('continue.txt') != ''"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ARGS=$(cat continue.txt); echo "이어하기: $ARGS"
          gh workflow run collect.yml --ref "${{ github.ref_name }}" -f job=chain -f args="$ARGS"
