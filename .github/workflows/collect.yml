name: collect-and-deploy
on:
  schedule:
    - cron: "0 22 * * 0-4"     # 평일 07:00 KST: 시세
    - cron: "30 20 2 * *"      # 매월 2일 05:30 KST: 재무(연간+최근분기)
    - cron: "30 20 1,15 * *"   # 매월 1일·15일 05:30 KST: 신용등급
    - cron: "0 19 * * 1,4"     # 매주 화·금 04:00 KST: 뉴스
    - cron: "0 20 5 4 *"       # 4/5 05:00 KST: 사업내용·감사의견·주주 (사업보고서)
  workflow_dispatch:
    inputs:
      job:
        description: "run.py job"
        default: "price"
        type: choice
        options: [init, fin, kpi, biz, mezz, price, rating, news, summarize, site, all]
      args:
        description: "추가 인자 (예: --years 2024 2025 / --limit 50 / --market KOSPI KONEX --new-only)"
        default: ""
      restore_run:
        description: "이전 실행의 DB 아티팩트로 복원 (run id, 선택)"
        default: ""
concurrency:
  group: kosdaq-db            # DB를 공유하므로 동시 실행 금지(뒤 실행은 대기)
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # DB는 저장소가 아니라 Actions 아티팩트(kosdaq-db, 90일 보관)에만 둔다 — GitHub 100MB 파일 제한 때문.
      # 매 실행: 지정 run 또는 가장 최근 '성공' 실행의 아티팩트를 받아 이어서 작업하고 다시 올린다.
      - name: restore db
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          RID="${{ github.event.inputs.restore_run }}"
          if [ -z "$RID" ]; then
            for id in $(gh run list -w collect.yml -s success -L 15 --json databaseId -q '.[].databaseId'); do
              if gh run download $id -n kosdaq-db -D . 2>/dev/null; then RID=$id; break; fi
            done
          else
            gh run download $RID -n kosdaq-db -D .
          fi
          if [ -f kosdaq.db.gz ] && [ ! -f kosdaq.db ]; then gunzip -f kosdaq.db.gz; fi
          echo "복원 run: ${RID:-없음(새 DB)}"; ls -la kosdaq.db* || true
      - name: collect
        env:
          PYTHONUNBUFFERED: "1"
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 20 2 * *") JOB=fin ;;
              "30 20 1,15 * *") JOB=rating ;;
              "0 19 * * 1,4") JOB=news ;;
              "0 20 5 4 *")  JOB=biz ;;
              *)             JOB=price ;;
            esac
            python run.py $JOB
          else
            python run.py ${{ github.event.inputs.job || 'price' }} ${{ github.event.inputs.args }}
          fi
      - name: pack db
        if: always()
        run: |
          python -c "import sqlite3;c=sqlite3.connect('kosdaq.db');c.execute('VACUUM');c.close()" || true
          rm -f kosdaq.db.gz; gzip -6 -c kosdaq.db > kosdaq.db.gz; ls -la kosdaq.db.gz
      - name: keep db artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: kosdaq-db, path: kosdaq.db.gz, retention-days: 90, compression-level: 0 }
      - name: prune old db artifacts   # 비공개 저장소 아티팩트 총량 500MB 제한 → 최신 2개(+마지막 성공)만 유지
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          LS=$(gh run list -w collect.yml -s success -L 1 --json databaseId -q '.[0].databaseId')   # 마지막 성공 실행은 항상 보존
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=kosdaq-db&per_page=100" -q '.artifacts[] | "\(.id) \(.created_at) \(.workflow_run.id)"' \
            | sort -k2 -r | tail -n +3 | while read id dt rid; do
              if [ "$rid" != "${{ github.run_id }}" ] && [ "$rid" != "$LS" ]; then gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "삭제 $id ($dt)"; fi
            done || true
      - name: build site
        run: python run.py site
      - name: ensure pages project
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create kosdaq-db --production-branch=main
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name kosdaq-db
