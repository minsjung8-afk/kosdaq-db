name: collect-and-deploy
on:
  schedule:
    - cron: "0 22 * * 0-4"     # 평일 07:00 KST: 시세
    - cron: "30 20 1 * *"      # 매월 1일 05:30 KST: 재무(연간+최근분기)
    - cron: "30 20 15 * *"     # 매월 15일 05:30 KST: 신용등급
    - cron: "0 20 5 4 *"       # 4/5 05:00 KST: 사업내용·감사의견·주주 (사업보고서)
  workflow_dispatch:
    inputs:
      job:
        description: "run.py job"
        default: "price"
        type: choice
        options: [init, fin, kpi, biz, price, rating, summarize, site, all]
      args:
        description: "추가 인자 (예: --years 2024 2025 / --limit 50)"
        default: ""
      restore_run:
        description: "이전 실행의 DB 아티팩트로 복원 (run id, 선택)"
        default: ""
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: restore db
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -n "${{ github.event.inputs.restore_run }}" ]; then
            gh run download ${{ github.event.inputs.restore_run }} -n kosdaq-db -D . && echo "아티팩트에서 복원"
          fi
          if [ ! -f kosdaq.db ] && [ -f kosdaq.db.gz ]; then gunzip -kf kosdaq.db.gz; fi
          ls -la kosdaq.db* || true
      - name: collect
        env:
          PYTHONUNBUFFERED: "1"
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 20 1 * *") JOB=fin ;;
              "30 20 15 * *") JOB=rating ;;
              "0 20 5 4 *")  JOB=biz ;;
              *)             JOB=price ;;
            esac
            python run.py $JOB
          else
            python run.py ${{ github.event.inputs.job || 'price' }} ${{ github.event.inputs.args }}
          fi
      - name: keep db artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: kosdaq-db, path: kosdaq.db, retention-days: 7 }
      - name: build site
        run: python run.py site
      - name: commit db
        run: |
          git config user.name "kosdaq-bot"; git config user.email "bot@users.noreply.github.com"
          python -c "import sqlite3;c=sqlite3.connect('kosdaq.db');c.execute('VACUUM');c.close()"
          gzip -9 -c kosdaq.db > kosdaq.db.gz && ls -la kosdaq.db.gz
          git rm --cached -q kosdaq.db 2>/dev/null || true
          git add kosdaq.db.gz .gitignore && git commit -m "data: $(date -u +%F)" || echo "no change"
          git pull --rebase -X theirs || true      # 실행 중 코드 푸시가 있어도 DB 커밋 유지
          git push
      - name: ensure pages project
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create kosdaq-db --production-branch=main
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name kosdaq-db
