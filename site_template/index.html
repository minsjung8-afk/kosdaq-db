<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상장사 심사참고 DB</title>
<script src="lib/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 좌측 고정 검색 패널 + 우측 프로필. 공시 열람 도구의 밀도, 장식 없음 */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#1b1f1d; --mute:#6b716e; --line:#dcdfdb;
  --accent:#1f5f8b; --accent-bg:#e8f0f6; --good:#2e7d4f; --warn:#b26a00; --bad:#b3261e;
  --g1:#eef3f8; --g2:#f7f2ea; --g3:#eef5ef;   /* 손익 / 자산부채자본 / 재무지표 음영 */
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181a;--panel:#1d2124;--fg:#e6e8e6;--mute:#9aa19d;--line:#2f3539;--accent:#6fb1e0;--accent-bg:#1e2f3c;--good:#6cc08f;--warn:#e0a53a;--bad:#f07a73;--g1:#1c252e;--g2:#262220;--g3:#1d2823;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--font);display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;font-weight:600;margin:0}
header .meta{color:var(--mute);font-size:12px;font-family:var(--mono)}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside .search{padding:12px;border-bottom:1px solid var(--line)}
.mk{font-size:10px;padding:1px 5px;border-radius:3px;margin-right:5px;font-family:var(--mono);color:#fff;vertical-align:1px}.mk.KOSDAQ{background:#2a7fd4}.mk.KOSPI{background:#c0392b}.mk.KONEX{background:#7f8c8d}
.sorts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.sorts .lbl{font-size:11px;color:var(--mute);line-height:20px}.sbtn{font-size:11px;padding:2px 7px;border:1px solid var(--line);background:var(--panel);color:var(--mute);cursor:pointer;border-radius:3px}.sbtn.on{color:var(--fg);border-color:var(--accent);font-weight:600}
.mkts{display:flex;gap:4px;margin-top:6px}.mbtn{font-size:11px;padding:2px 8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;border-radius:3px}.mbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
aside input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit}
aside input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
#list{overflow:auto;flex:1;min-height:0}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover,.row.on{background:var(--accent-bg)}
.row .nm{font-weight:500}
.row .cd{font-family:var(--mono);color:var(--mute);font-size:12px}
.row .sub{grid-column:1/-1;font-size:12px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
main{overflow:auto;min-width:0;padding:18px 22px 40px}
.empty{color:var(--mute);padding:40px 0;max-width:60ch}
h2{font-size:22px;margin:0 0 2px;font-weight:600}
.sub-title{color:var(--mute);font-family:var(--mono);font-size:13px;margin-bottom:16px}
section{margin-bottom:26px}
section>h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}@media (min-width:1700px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.tile .k{font-size:11px;color:var(--mute);letter-spacing:.03em}
.tile .v{font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;color:var(--mute);margin-left:2px}
.tile .d{font-size:11px;color:var(--mute);font-family:var(--mono)}
.tile .kvs{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:2px 10px;font-size:12.5px;margin-top:3px}.tile .kvs b{font-weight:500;color:var(--mute)}.tile .kvs span{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.tile .foot{font-size:11px;color:var(--mute);margin-top:5px;border-top:1px dashed var(--line);padding-top:4px}
/* 업종 내 위치: 카드형 */
.ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 18px;margin-top:6px}
.ind .it .lb{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}.ind .it .lb b{font-weight:500}.ind .it .lb span{font-variant-numeric:tabular-nums;font-weight:600}
.ind .it .hint{font-size:10.5px;color:var(--mute);margin-top:2px}
/* 재무현황 표 */
table.fin{font-size:13px}table.fin th,table.fin td{padding:5px 7px;vertical-align:middle;line-height:1.35}
table.fin th,table.fin td{white-space:nowrap}table.fin th.n,table.fin td.n{font-family:var(--font);font-variant-numeric:tabular-nums}
table.fin td:first-child{font-weight:500;white-space:nowrap}table.fin td:first-child small{font-weight:400;color:var(--mute)}
table.fin td .val{display:inline-block;min-width:3.2em;text-align:right;font-weight:500}table.fin td .val.neg{color:var(--bad)}
table.fin td .chg{display:inline-block;min-width:4.4em;text-align:right;font-size:10px;color:var(--mute);margin-left:4px;letter-spacing:-.01em}table.fin td .chg.up{color:var(--good)}table.fin td .chg.dn{color:var(--bad)}
table.fin tr.g1>td:first-child{border-left:3px solid #4a7fb5}table.fin tr.g2>td:first-child{border-left:3px solid #b8894a}table.fin tr.g3>td:first-child{border-left:3px solid #4f9a6a}
table.fin tr.gs>td{border-top:2px solid var(--line)}
table.fin th.sep,table.fin td.sep{border-left:3px solid var(--line)}
table.fin th.top{text-align:center;font-weight:700;color:var(--fg);font-size:13px;background:var(--bg)}
table.fin th.col{font-size:12.5px;font-weight:600;color:var(--fg)}table.fin th.col a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
table.fin th.col.cur{color:var(--accent)}
.twrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px}
tr.g1>td,tr.g1>th{background:var(--g1)} tr.g2>td,tr.g2>th{background:var(--g2)} tr.g3>td,tr.g3>th{background:var(--g3)}
td.sep,th.sep{border-left:2px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:top}
.kv{display:grid;grid-template-columns:max-content 1fr max-content 1fr;gap:4px 14px;font-size:13px}
.kv b{color:var(--mute);font-weight:500}
.pill{display:inline-block;padding:1px 7px;border-radius:3px;font-size:12px;font-family:var(--mono);border:1px solid var(--line)}
.pill.good{color:var(--good);border-color:var(--good)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)}
.neg{color:var(--bad)}
.summary{max-width:72ch;white-space:pre-wrap}
.summary ul{margin:6px 0;padding-left:18px}
.src{font-size:12px;color:var(--mute)} .src a{color:var(--accent)}

.flags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.flag{font:12px var(--mono);padding:3px 9px;border-radius:3px;border:1px solid}
.flag.red{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.flag.amber{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.flag.ok{color:var(--good);border-color:var(--good)}
.bar{position:relative;height:8px;background:var(--line);border-radius:4px}
.bar i{position:absolute;top:-3px;width:3px;height:14px;background:var(--accent);border-radius:2px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:3px 0 3px 12px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-7px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--mute)}
.tl li.red::before{background:var(--bad)} .tl li.amber::before{background:var(--warn)}
.pbtn{font:12px var(--mono);padding:3px 10px;border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:3px;cursor:pointer}.pbtn.on{color:var(--accent);border-color:var(--accent)}
#px{position:relative;height:380px;background:var(--panel);border:1px solid var(--line)}
#pxl{position:absolute;left:8px;top:6px;z-index:5;font:11px var(--mono);color:var(--mute);pointer-events:none;line-height:1.5}#pxl b{color:var(--fg);font-weight:600}
.ptb{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap;align-items:center}.ptb .sp{width:10px}.ptb .lbl{font-size:11px;color:var(--mute);margin-left:4px}
a{color:var(--accent)}

.flags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.flag{font:12px var(--mono);padding:3px 9px;border-radius:3px;border:1px solid}
.flag.red{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.flag.amber{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.flag.ok{color:var(--good);border-color:var(--good)}
.bar{position:relative;height:8px;background:var(--line);border-radius:4px}
.bar i{position:absolute;top:-3px;width:3px;height:14px;background:var(--accent);border-radius:2px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:3px 0 3px 12px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-7px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--mute)}
.tl li.red::before{background:var(--bad)} .tl li.amber::before{background:var(--warn)}
.pbtn{font:12px var(--mono);padding:3px 10px;border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:3px;cursor:pointer}.pbtn.on{color:var(--accent);border-color:var(--accent)}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}aside{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}main{padding:14px 16px}}
</style>
</head>
<body>
<header><h1>상장사 심사참고 DB</h1><span class="meta" id="meta">불러오는 중</span></header>
<aside>
  <div class="search"><input id="q" placeholder="회사명 · 종목코드 · 업종" autocomplete="off"><div class="mkts" id="mkts"><button class="mbtn on" data-m="">전체</button><button class="mbtn" data-m="KOSDAQ">코스닥</button><button class="mbtn" data-m="KOSPI">코스피</button><button class="mbtn" data-m="KONEX">코넥스</button></div><div class="sorts" id="sorts"><span class="lbl">정렬</span><button class="sbtn on" data-s="name">이름</button><button class="sbtn" data-s="market">시장</button><button class="sbtn" data-s="mcap">시총</button><button class="sbtn" data-s="per">PER</button><button class="sbtn" data-s="ev">EV/EBITDA</button><button class="sbtn" data-s="sector">업종</button></div><div class="hint" id="cnt"></div></div>
  <div id="list"></div>
</aside>
<main id="main"><div class="empty">왼쪽에서 종목을 고르세요. 재무는 DART 사업보고서(연결 우선), 주가는 KRX 일별시세 기준이며 심사 참고용 요약입니다. 원문은 각 항목의 DART 링크로 확인하세요.</div></main>
<script>
const $=s=>document.querySelector(s);
const 억=v=>v==null?'-':(v/1e8).toLocaleString('ko-KR',{maximumFractionDigits:0});
const pct=v=>v==null?'-':v.toFixed(1)+'%';
const num=v=>v==null?'-':Math.round(Number(v)).toLocaleString('ko-KR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let items=[],cur=null;

fetch('data/companies.json').then(r=>r.json()).then(j=>{
  items=j.items; $('#meta').textContent=`${j.meta.count}개사 · 빌드 ${j.meta.built_at}` + (j.meta.price_asof?` · 시세 ${j.meta.price_asof}`:'');
  render(items); const h=location.hash.slice(1); if(/^\d{6}$/.test(h)) open(h);
});
let mkt='',sortKey='name',sortDesc=false;
const MK={KOSDAQ:0,KOSPI:1,KONEX:2};
function sortList(l){
  const nv=v=>v==null||isNaN(v)?null:Number(v);
  const cmp={
    name:(a,b)=>a.name.localeCompare(b.name,'ko'),
    market:(a,b)=>(MK[a.market]??9)-(MK[b.market]??9)||a.name.localeCompare(b.name,'ko'),
    sector:(a,b)=>(a.sector||'힣').localeCompare(b.sector||'힣','ko')||a.name.localeCompare(b.name,'ko'),
    mcap:(a,b)=>(nv(b.mcap)??-1)-(nv(a.mcap)??-1),
    per:(a,b)=>{const x=nv(a.per),y=nv(b.per);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return x-y},
    ev:(a,b)=>{const x=nv(a.ev_ebitda),y=nv(b.ev_ebitda);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return x-y},
  }[sortKey];
  const out=[...l].sort(cmp);
  if(sortDesc){ // 값 없는 항목은 역순에서도 맨 뒤
    const has=i=>sortKey==='mcap'?nv(i.mcap)!=null:sortKey==='per'?nv(i.per)!=null:sortKey==='ev'?nv(i.ev_ebitda)!=null:true;
    const a=out.filter(has).reverse(),b=out.filter(i=>!has(i)); return a.concat(b);
  }
  return out;
}
function applyFilter(){
  const t=$('#q').value.trim().toLowerCase();
  let l=mkt?items.filter(i=>i.market===mkt):items;
  if(t) l=l.filter(i=>(i.name+' '+i.code+' '+(i.sector||'')+' '+(i.industry||'')).toLowerCase().includes(t));
  render(sortList(l));
}
document.querySelectorAll('.sbtn').forEach(b=>b.onclick=()=>{
  if(sortKey===b.dataset.s){sortDesc=!sortDesc;} else {sortKey=b.dataset.s;sortDesc=false;}
  document.querySelectorAll('.sbtn').forEach(x=>{x.classList.toggle('on',x===b);x.textContent=x.textContent.replace(/ [▲▼]$/,'');});
  b.textContent+=sortDesc?' ▼':' ▲'; applyFilter();
});
$('#q').addEventListener('input',applyFilter);
document.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>{mkt=b.dataset.m;document.querySelectorAll('.mbtn').forEach(x=>x.classList.toggle('on',x===b));applyFilter()});
function render(list){
  $('#cnt').textContent=`${list.length}개`;
  $('#list').innerHTML=list.slice(0,300).map(i=>`<div class="row${cur===i.code?' on':''}" data-c="${i.code}">
    <span class="nm"><span class="mk ${esc(i.market||'')}">${i.market==='KOSPI'?'코스피':i.market==='KONEX'?'코넥스':'코스닥'}</span>${esc(i.name)}</span><span class="cd">${i.code}</span>
    <span class="sub"><span>${esc(i.sector||'')}</span><span>시총 ${억(i.mcap)}억</span><span>매출 ${억(i.rev)}억</span><span>부채비율 ${pct(i.debt)}</span>${i.per!=null?`<span>PER ${Number(i.per).toFixed(1)}</span>`:''}${i.ev_ebitda!=null?`<span>EV/EBITDA ${Number(i.ev_ebitda).toFixed(1)}</span>`:''}${i.red?`<span class="neg">⚑${i.red}</span>`:''}${i.amber?`<span style="color:var(--warn)">⚑${i.amber}</span>`:''}${i.rating?`<span style="color:var(--accent)">${esc(i.rating)}</span>`:''}${i.opinion&&i.opinion!=='적정'?`<span class="neg">${esc(i.opinion)}</span>`:''}</span></div>`).join('')
    +(list.length>300?'<div class="row"><span class="cd">상위 300개만 표시 · 검색어를 좁히세요</span></div>':'');
}
$('#list').addEventListener('click',e=>{const r=e.target.closest('.row');if(r&&r.dataset.c)open(r.dataset.c)});

async function open(code){
  cur=code; location.hash=code; document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',r.dataset.c===code));
  const d=await fetch(`data/c/${code}.json`).then(r=>r.json()).catch(()=>null);
  if(!d){$('#main').innerHTML='<div class="empty">상세 데이터가 없습니다.</div>';return}
  const c=d.company, ps=d.price_summary||{}, kp=d.kpi.CFS||d.kpi.OFS||[], last=[...kp].reverse().find(r=>r.kind==='annual')||kp[kp.length-1]||{}, ao=d.audit[0];
  const opClass=o=>!o?'':o==='적정'?'good':/한정/.test(o)?'warn':'bad';
  const LONG=['기업신용평가','회사채','사채'];
  const curRt=(d.ratings||[]).find(r=>LONG.some(k=>(r.target_type||'').includes(k)));
  const rtBadge=curRt?`<span class="pill" style="margin-left:10px;vertical-align:middle;font-size:14px;color:var(--accent);border-color:var(--accent)">${esc(curRt.grade)}${curRt.outlook?' '+esc(curRt.outlook):''}</span><span class="src" style="margin-left:6px">${esc(curRt.agency)} · ${curRt.disc_dt}</span>`:`<span class="src" style="margin-left:10px">유효 공시등급 없음</span>`;
  const fl=d.flags||[];
  const flagStrip=fl.length?`<div class="flags">${fl.map(([n,l,t])=>`<span class="flag ${l}" title="${esc(t)}">${esc(n)}${t?` <small>${esc(t)}</small>`:''}</span>`).join('')}</div>`:`<div class="flags"><span class="flag ok">경고 플래그 없음</span></div>`;
  let h=`<h2>${esc(c.corp_name)}${rtBadge}</h2><div class="sub-title">${c.stock_code} · ${esc(c.market)}${c.sect_tp?' '+esc(c.sect_tp):''} · ${esc(c.sector_krx||'')} (KSIC ${esc(c.induty_code||'-')})${c.corp_name_full&&c.corp_name_full!==c.corp_name?' · '+esc(c.corp_name_full):''}</div>`;
  h+=flagStrip;
  h+=`<div class="tiles">
    <div class="tile"><div class="k">시가총액</div><div class="v">${억(ps.mcap)}<small>억</small></div><div class="d">${ps.asof||''}</div></div>
    <div class="tile"><div class="k">매출액 (${last.label||last.bsns_year||'-'}, ${d.kpi.CFS?'연결':'별도'})</div><div class="v">${억(last.revenue)}<small>억</small></div><div class="d">영업이익 ${억(last.op_income)}억</div></div>
    <div class="tile"><div class="k">부채비율 (${last.label||last.bsns_year||'-'})</div><div class="v">${pct(last.debt_ratio)}</div><div class="kvs"><b>순차입금/EBITDA</b><span>${last.nd_ebitda!=null?last.nd_ebitda.toFixed(1)+'x':'-'}</span><b>차입금의존도</b><span>${pct(last.borrow_dep)}</span><b>유동비율</b><span>${pct(last.cur_ratio)}</span></div></div>
    <div class="tile"><div class="k">감사의견 ${ao?ao.bsns_year:''}</div><div class="v"><span class="pill ${opClass(ao&&ao.adt_opinion)}">${esc(ao?ao.adt_opinion:'-')}</span></div><div class="d">${esc(ao?ao.adtor:'')}</div></div>
    <div class="tile"><div class="k">1년 수익률</div><div class="v ${ps.chg_1y<0?'neg':''}">${pct(ps.chg_1y)}</div><div class="kvs"><b>변동성 (60일, 연율)</b><span>${pct(ps.vol_60d)}</span><b>일평균 거래대금 (3M)</b><span>${억(ps.avg_value_3m)}억</span></div></div>

  if((d.other_invest||[]).length){ h+=`<section><h3>3-2. 타법인 출자 (최근 사업보고서, 장부가 상위)</h3><div class="twrap"><table><tr><th>출자회사</th><th>목적</th><th>최초취득</th><th class="n">지분율</th><th class="n">장부가(억)</th><th class="n">피출자사 순이익(억)</th></tr>${d.other_invest.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.purpose||'-')}</td><td>${esc(r.acqs_de||'-')}</td><td class="n">${pct(r.trmend_qota_rt)}</td><td class="n">${억(r.trmend_book_amt)}</td><td class="n ${r.recent_ni<0?'neg':''}">${억(r.recent_ni)}</td></tr>`).join('')}</table></div></section>`;}
  // 4 주가

    const rc=v=>v==null?'-':`<span style="color:${v<0?'var(--bad)':v>0?'var(--good)':'inherit'}">${(v>0?'+':'')+v.toFixed(1)}%</span>`;
    h+=`<div class="ptb"><button class="pbtn on" data-tf="D">일봉</button><button class="pbtn" data-tf="W">주봉</button><button class="pbtn" data-tf="M">월봉</button><span class="sp"></span><button class="pbtn" data-p="3m">3개월</button><button class="pbtn" data-p="6m">6개월</button><button class="pbtn on" data-p="1y">1년</button><button class="pbtn" data-p="3y">3년</button><span class="sp"></span><span class="lbl">이평</span><button class="pbtn on" data-ma="5">5</button><button class="pbtn on" data-ma="20">20</button><button class="pbtn on" data-ma="60">60</button><button class="pbtn" data-ma="120">120</button><span class="lbl">휠 확대·축소 / 드래그 이동 / 더블클릭 초기화</span></div><div id="px"><div id="pxl"></div></div>

  else h+=`<div class="src">주가 미수집</div>`;
  h+=`</section>`;
  // 5 공시 타임라인
  h+=`<section><h3>5. 주요 공시 타임라인 (심사 키워드 필터)</h3>`;
  if(d.events.length){const lvl=f=>['감사의견','관리종목','최대주주변경','횡령배임','거래정지','상장폐지','회생'].includes(f)?'red':['유상증자','CB','BW','EB','소송','채무','담보제공'].includes(f)?'amber':'';
    h+=`<ul class="tl">${d.events.map(e=>`<li class="${lvl(e.flag)}"><span class="src" style="font-family:var(--mono)">${e.rcept_dt.slice(0,4)}-${e.rcept_dt.slice(4,6)}-${e.rcept_dt.slice(6,8)}</span> <span class="pill">${esc(e.flag)}</span> <a href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${e.rcept_no}" target="_blank" rel="noopener">${esc(e.report_nm)}</a></li>`).join('')}</ul>`;}
  else h+=`<div class="src">해당 없음 / 미수집</div>`;
  h+=`</section>`;
  // 6 리포트 (메타 + 추출 수치·자체 요약만. 원문 미포함)
  h+=`<section><h3>6. 증권사 리포트 · 분석</h3>`;
  if(d.reports.length){
    h+=`<div class="twrap"><table><tr><th>일자</th><th>증권사 / 애널리스트</th><th>제목</th><th>의견</th><th class="n">목표가</th></tr>${d.reports.map(r=>`<tr><td>${r.pub_dt}</td><td>${esc(r.publisher||'-')}${r.analyst?` / ${esc(r.analyst)}`:''}</td><td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></td><td>${esc(r.opinion||'-')}</td><td class="n">${num(r.target_price)}${r.old_target_price&&r.old_target_price!==r.target_price?`<br><small style="color:var(--mute)">← ${num(r.old_target_price)}</small>`:''}</td></tr>`).join('')}</table></div>`;
    const fva=d.forecast_vs_actual||[];
    if(fva.length){h+=`<div class="src" style="margin:12px 0 4px">전망 vs 실적 (억원, 달성률)</div><div class="twrap"><table><tr><th>발행</th><th>증권사</th><th>대상연도</th><th class="n">매출 전망</th><th class="n">실제</th><th class="n">달성</th><th class="n">영업이익 전망</th><th class="n">실제</th><th class="n">달성</th></tr>${fva.map(f=>`<tr><td>${f.pub_dt}</td><td>${esc(f.publisher||'')}</td><td>${f.year}</td><td class="n">${억(f.f_rev)}</td><td class="n">${억(f.a_rev)}</td><td class="n ${f.ach_rev!=null&&f.ach_rev<90?'neg':''}">${pct(f.ach_rev)}</td><td class="n">${억(f.f_op)}</td><td class="n">${억(f.a_op)}</td><td class="n ${f.ach_op!=null&&f.ach_op<80?'neg':''}">${pct(f.ach_op)}</td></tr>`).join('')}</table></div>`;}
    for(const r of d.reports.filter(r=>r.memo_md).slice(0,3)){
      const pts=JSON.parse(r.points_json||'[]'), rk=JSON.parse(r.risks_json||'[]'), va=JSON.parse(r.valuation_json||'null');
      h+=`<div style="margin-top:14px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);max-width:90ch"><div class="src">${r.pub_dt} · ${esc(r.publisher)} ${va&&va.method?`· 밸류에이션 ${esc(va.method)}${va.multiple?` ${va.multiple}x`:''}`:''}</div>
        <div class="summary" style="margin:6px 0">${esc(r.memo_md)}</div>
        ${pts.length?`<div class="src">투자포인트</div><ul style="margin:2px 0 6px;padding-left:18px">${pts.map(p=>`<li>${esc(p.point)}${p.evidence?` <span class="src">(${esc(p.evidence)})</span>`:''}</li>`).join('')}</ul>`:''}
        ${rk.length?`<div class="src">리스크</div><ul style="margin:2px 0;padding-left:18px">${rk.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`;}
  } else h+=`<div class="src">커버리지 없음 / 미수집</div>`;
  h+=`</section>`;
  // 7 동일 업종 비교
  h+=`<section><h3>7. 동일 업종 비교 (KSIC ${esc((c.induty_code||'').slice(0,2))} · 같은 시장 내 시총 근접 3사, 최근 연간)</h3>`;
  if((d.peers||[]).length){const me=last; const row=(nm,code,mc,r,isMe)=>`<tr ${isMe?'style="font-weight:600;background:var(--accent-bg)"':''}><td>${code?`<a href="#${code}">${esc(nm)}</a>`:esc(nm)}</td><td class="n">${억(mc)}</td><td class="n">${억(r.revenue)}</td><td class="n ${r.op_income<0?'neg':''}">${억(r.op_income)}</td><td class="n">${pct(r.op_margin)}</td><td class="n">${pct(r.debt_ratio)}</td><td class="n">${억(r.ebitda)}</td><td class="n">${억(r.net_borrowings)}</td></tr>`;
    h+=`<div class="twrap"><table><tr><th>회사</th><th class="n">시총(억)</th><th class="n">매출</th><th class="n">영업이익</th><th class="n">영업이익률</th><th class="n">부채비율</th><th class="n">EBITDA</th><th class="n">순차입금</th></tr>${row(c.corp_name,null,ps.mcap,me,true)}${d.peers.map(p=>row(p.corp_name,p.stock_code,p.mcap,p,false)).join('')}</table></div>`;}
  else h+=`<div class="src">비교 가능한 동일 업종 데이터 없음</div>`;
  h+=`</section>`;

  if((d.news||[]).length){
    const tok=t=>new Set(t.replace(new RegExp(esc(c.corp_name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'),'').replace(/[^가-힣a-zA-Z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=2));
    const groups=[]; for(const n of d.news){const t=tok(n.title); let g=groups.find(g=>{const a=[...t].filter(w=>g.tok.has(w)).length; return a>=Math.max(2,Math.min(t.size,g.tok.size)*0.5)}); if(g){g.items.push(n); t.forEach(w=>g.tok.add(w));} else groups.push({tok:t,items:[n]});}
    h+=`<ul style="list-style:none;padding:0;margin:0">${groups.map((g,i)=>{const f=g.items[0]; const more=g.items.length-1; return `<li style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="src" style="font-family:var(--mono)">${f.dt}</span> <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a> <span class="src">${esc(f.source)}</span>${more?` <button class="pbtn" data-ng="${i}">외 ${more}건 ▾</button><ul id="ng${i}" hidden style="list-style:none;padding:4px 0 0 18px;margin:0">${g.items.slice(1).map(n=>`<li style="padding:2px 0"><span class="src" style="font-family:var(--mono)">${n.dt}</span> <a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a> <span class="src">${esc(n.source)}</span></li>`).join('')}</ul>`:''}</li>`}).join('')}</ul>`;}

let CH=null;
function aggregate(p,tf){ // 일봉 → 주봉/월봉 집계
  if(tf==='D') return p;
  const out=[]; let cur=null,key=null;
  for(const [dt,o,h,l,c,v] of p){ const d=new Date(dt+'T00:00:00'); let k;
    if(tf==='W'){ const m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7)); k=m.toISOString().slice(0,10); } else k=dt.slice(0,7);
    if(k!==key){ if(cur) out.push(cur); cur=[dt,o,h,l,c,v]; key=k; } else { cur[2]=Math.max(cur[2],h); cur[3]=Math.min(cur[3],l); cur[4]=c; cur[5]+=v; } }
  if(cur) out.push(cur); return out;
}
function initChart(prices){
  const el=$('#px'), lg=$('#pxl');
  if(CH){ try{CH.chart.remove();}catch(e){} CH=null; }
  const cs=getComputedStyle(document.documentElement), tok=k=>cs.getPropertyValue(k).trim();
  const UP='#d7342b', DN='#1f5fc4', MAC={5:'#e0a800',20:'#2e9e5b',60:'#8e44ad',120:'#7f8c8d'};
  const chart=LightweightCharts.createChart(el,{autoSize:true,layout:{background:{color:tok('--panel')},textColor:tok('--mute'),fontFamily:tok('--mono'),fontSize:11},
    grid:{vertLines:{color:tok('--line')},horzLines:{color:tok('--line')}},rightPriceScale:{borderColor:tok('--line')},timeScale:{borderColor:tok('--line'),rightOffset:3,minBarSpacing:2},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},localization:{locale:'ko-KR',priceFormatter:v=>Math.round(v).toLocaleString('ko-KR')}});
  const candle=chart.addCandlestickSeries({upColor:tok('--panel'),downColor:DN,borderUpColor:UP,borderDownColor:DN,wickUpColor:UP,wickDownColor:DN,priceLineVisible:false,lastValueVisible:true});
  const vol=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol',lastValueVisible:false,priceLineVisible:false});
  chart.priceScale('vol').applyOptions({scaleMargins:{top:0.82,bottom:0},borderVisible:false});
  candle.priceScale().applyOptions({scaleMargins:{top:0.06,bottom:0.22}});
  const mas={}; for(const n of [5,20,60,120]) mas[n]=chart.addLineSeries({color:MAC[n],lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,visible:n!==120});
  CH={chart,candle,vol,mas,tf:'D',per:'1y',rows:[]};
  function load(tf){
    const rows=aggregate(prices,tf); CH.rows=rows; CH.tf=tf;
    candle.setData(rows.map(([t,o,h,l,c])=>({time:t,open:o,high:h,low:l,close:c})));
    vol.setData(rows.map(([t,o,,,c,v])=>({time:t,value:v,color:(c>=o?UP:DN)+'55'})));
    for(const n of [5,20,60,120]){ const d=[]; let s=0; for(let i=0;i<rows.length;i++){ s+=rows[i][4]; if(i>=n) s-=rows[i-n][4]; if(i>=n-1) d.push({time:rows[i][0],value:s/n}); } mas[n].setData(d); }
    range(CH.per);
  }
  function range(per){
    CH.per=per; const rows=CH.rows; if(!rows.length) return;
    const last=new Date(rows[rows.length-1][0]+'T00:00:00'), from=new Date(last);
    if(per==='3m') from.setMonth(from.getMonth()-3); else if(per==='6m') from.setMonth(from.getMonth()-6); else if(per==='1y') from.setFullYear(from.getFullYear()-1); else from.setFullYear(from.getFullYear()-3);
    const f=from.toISOString().slice(0,10); const first=rows.find(r=>r[0]>=f)||rows[0];
    chart.timeScale().setVisibleRange({from:first[0],to:rows[rows.length-1][0]});
  }
  const fmtLegend=r=>{ if(!r) return ''; const [t,o,h,l,c,v]=r; const i=CH.rows.indexOf(r); const pc=i>0?CH.rows[i-1][4]:null; const ch=pc?((c/pc-1)*100):null;
    return `<b>${t}</b> 시 ${num(o)} 고 ${num(h)} 저 ${num(l)} 종 <b>${num(c)}</b>${ch==null?'':` <span style="color:${ch>=0?UP:DN}">${ch>=0?'+':''}${ch.toFixed(2)}%</span>`} · 거래량 ${num(v)}`; };
  chart.subscribeCrosshairMove(p=>{ if(!p.time){ lg.innerHTML=fmtLegend(CH.rows[CH.rows.length-1]); return; } const t=typeof p.time==='string'?p.time:`${p.time.year}-${String(p.time.month).padStart(2,'0')}-${String(p.time.day).padStart(2,'0')}`; lg.innerHTML=fmtLegend(CH.rows.find(r=>r[0]===t)); });
  el.addEventListener('dblclick',()=>range(CH.per));
  document.querySelectorAll('.pbtn[data-tf]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pbtn[data-tf]').forEach(x=>x.classList.toggle('on',x===b));load(b.dataset.tf)});
  document.querySelectorAll('.pbtn[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pbtn[data-p]').forEach(x=>x.classList.toggle('on',x===b));range(b.dataset.p)});
  document.querySelectorAll('.pbtn[data-ma]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');mas[b.dataset.ma].applyOptions({visible:b.classList.contains('on')})});
  load('D'); lg.innerHTML=fmtLegend(CH.rows[CH.rows.length-1]);
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(/^\d{6}$/.test(h)&&h!==cur)open(h)});
