<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코스닥 심사참고 DB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 좌측 고정 검색 패널 + 우측 프로필. 공시 열람 도구의 밀도, 장식 없음 */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#1b1f1d; --mute:#6b716e; --line:#dcdfdb;
  --accent:#1f5f8b; --accent-bg:#e8f0f6; --good:#2e7d4f; --warn:#b26a00; --bad:#b3261e;
  --g1:#eef3f8; --g2:#f7f2ea; --g3:#eef5ef;   /* 손익 / 자산부채자본 / 재무지표 음영 */
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181a;--panel:#1d2124;--fg:#e6e8e6;--mute:#9aa19d;--line:#2f3539;--accent:#6fb1e0;--accent-bg:#1e2f3c;--good:#6cc08f;--warn:#e0a53a;--bad:#f07a73;--g1:#1c252e;--g2:#262220;--g3:#1d2823;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--font);display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;font-weight:600;margin:0}
header .meta{color:var(--mute);font-size:12px;font-family:var(--mono)}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside .search{padding:12px;border-bottom:1px solid var(--line)}
aside input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit}
aside input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
#list{overflow:auto;flex:1;min-height:0}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover,.row.on{background:var(--accent-bg)}
.row .nm{font-weight:500}
.row .cd{font-family:var(--mono);color:var(--mute);font-size:12px}
.row .sub{grid-column:1/-1;font-size:12px;color:var(--mute);display:flex;gap:10px}
main{overflow:auto;min-width:0;padding:18px 22px 40px}
.empty{color:var(--mute);padding:40px 0;max-width:60ch}
h2{font-size:22px;margin:0 0 2px;font-weight:600}
.sub-title{color:var(--mute);font-family:var(--mono);font-size:13px;margin-bottom:16px}
section{margin-bottom:26px}
section>h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.tile .k{font-size:11px;color:var(--mute);letter-spacing:.03em}
.tile .v{font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;color:var(--mute);margin-left:2px}
.tile .d{font-size:11px;color:var(--mute);font-family:var(--mono)}
.twrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px}
tr.g1>td,tr.g1>th{background:var(--g1)} tr.g2>td,tr.g2>th{background:var(--g2)} tr.g3>td,tr.g3>th{background:var(--g3)}
td.sep,th.sep{border-left:2px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:top}
.kv{display:grid;grid-template-columns:max-content 1fr max-content 1fr;gap:4px 14px;font-size:13px}
.kv b{color:var(--mute);font-weight:500}
.pill{display:inline-block;padding:1px 7px;border-radius:3px;font-size:12px;font-family:var(--mono);border:1px solid var(--line)}
.pill.good{color:var(--good);border-color:var(--good)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)}
.neg{color:var(--bad)}
.summary{max-width:72ch;white-space:pre-wrap}
.summary ul{margin:6px 0;padding-left:18px}
.src{font-size:12px;color:var(--mute)} .src a{color:var(--accent)}

.flags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.flag{font:12px var(--mono);padding:3px 9px;border-radius:3px;border:1px solid}
.flag.red{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.flag.amber{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.flag.ok{color:var(--good);border-color:var(--good)}
.bar{position:relative;height:8px;background:var(--line);border-radius:4px}
.bar i{position:absolute;top:-3px;width:3px;height:14px;background:var(--accent);border-radius:2px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:3px 0 3px 12px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-7px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--mute)}
.tl li.red::before{background:var(--bad)} .tl li.amber::before{background:var(--warn)}
.pbtn{font:12px var(--mono);padding:3px 10px;border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:3px;cursor:pointer}.pbtn.on{color:var(--accent);border-color:var(--accent)}
canvas{width:100%;height:260px;display:block;background:var(--panel);border:1px solid var(--line)}
a{color:var(--accent)}

.flags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.flag{font:12px var(--mono);padding:3px 9px;border-radius:3px;border:1px solid}
.flag.red{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.flag.amber{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.flag.ok{color:var(--good);border-color:var(--good)}
.bar{position:relative;height:8px;background:var(--line);border-radius:4px}
.bar i{position:absolute;top:-3px;width:3px;height:14px;background:var(--accent);border-radius:2px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:3px 0 3px 12px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-7px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--mute)}
.tl li.red::before{background:var(--bad)} .tl li.amber::before{background:var(--warn)}
.pbtn{font:12px var(--mono);padding:3px 10px;border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:3px;cursor:pointer}.pbtn.on{color:var(--accent);border-color:var(--accent)}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}aside{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}main{padding:14px 16px}}
</style>
</head>
<body>
<header><h1>코스닥 심사참고 DB</h1><span class="meta" id="meta">불러오는 중</span></header>
<aside>
  <div class="search"><input id="q" placeholder="회사명 · 종목코드 · 업종" autocomplete="off"><div class="hint" id="cnt"></div></div>
  <div id="list"></div>
</aside>
<main id="main"><div class="empty">왼쪽에서 종목을 고르세요. 재무는 DART 사업보고서(연결 우선), 주가는 KRX 일별시세 기준이며 심사 참고용 요약입니다. 원문은 각 항목의 DART 링크로 확인하세요.</div></main>
<script>
const $=s=>document.querySelector(s);
const 억=v=>v==null?'-':(v/1e8).toLocaleString('ko-KR',{maximumFractionDigits:0});
const pct=v=>v==null?'-':v.toFixed(1)+'%';
const num=v=>v==null?'-':Math.round(Number(v)).toLocaleString('ko-KR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let items=[],cur=null;

fetch('data/companies.json').then(r=>r.json()).then(j=>{
  items=j.items; $('#meta').textContent=`${j.meta.count}개사 · 빌드 ${j.meta.built_at}` + (j.meta.price_asof?` · 시세 ${j.meta.price_asof}`:'');
  render(items); const h=location.hash.slice(1); if(/^\d{6}$/.test(h)) open(h);
});
$('#q').addEventListener('input',e=>{
  const t=e.target.value.trim().toLowerCase();
  render(t?items.filter(i=>(i.name+' '+i.code+' '+(i.sector||'')+' '+(i.industry||'')).toLowerCase().includes(t)):items);
});
function render(list){
  $('#cnt').textContent=`${list.length}개`;
  $('#list').innerHTML=list.slice(0,300).map(i=>`<div class="row${cur===i.code?' on':''}" data-c="${i.code}">
    <span class="nm">${esc(i.name)}</span><span class="cd">${i.code}</span>
    <span class="sub"><span>${esc(i.sector||'')}</span><span>매출 ${억(i.rev)}억</span><span>부채비율 ${pct(i.debt)}</span>${i.red?`<span class="neg">⚑${i.red}</span>`:''}${i.amber?`<span style="color:var(--warn)">⚑${i.amber}</span>`:''}${i.rating?`<span style="color:var(--accent)">${esc(i.rating)}</span>`:''}${i.opinion&&i.opinion!=='적정'?`<span class="neg">${esc(i.opinion)}</span>`:''}</span></div>`).join('')
    +(list.length>300?'<div class="row"><span class="cd">상위 300개만 표시 · 검색어를 좁히세요</span></div>':'');
}
$('#list').addEventListener('click',e=>{const r=e.target.closest('.row');if(r&&r.dataset.c)open(r.dataset.c)});

async function open(code){
  cur=code; location.hash=code; document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',r.dataset.c===code));
  const d=await fetch(`data/c/${code}.json`).then(r=>r.json()).catch(()=>null);
  if(!d){$('#main').innerHTML='<div class="empty">상세 데이터가 없습니다.</div>';return}
  const c=d.company, ps=d.price_summary||{}, kp=d.kpi.CFS||d.kpi.OFS||[], last=[...kp].reverse().find(r=>r.kind==='annual')||kp[kp.length-1]||{}, ao=d.audit[0];
  const opClass=o=>!o?'':o==='적정'?'good':/한정/.test(o)?'warn':'bad';
  const LONG=['기업신용평가','회사채','사채'];
  const curRt=(d.ratings||[]).find(r=>LONG.some(k=>(r.target_type||'').includes(k)));
  const rtBadge=curRt?`<span class="pill" style="margin-left:10px;vertical-align:middle;font-size:14px;color:var(--accent);border-color:var(--accent)">${esc(curRt.grade)}${curRt.outlook?' '+esc(curRt.outlook):''}</span><span class="src" style="margin-left:6px">${esc(curRt.agency)} · ${curRt.disc_dt}</span>`:`<span class="src" style="margin-left:10px">유효 공시등급 없음</span>`;
  const fl=d.flags||[];
  const flagStrip=fl.length?`<div class="flags">${fl.map(([n,l,t])=>`<span class="flag ${l}" title="${esc(t)}">${esc(n)}${t?` <small>${esc(t)}</small>`:''}</span>`).join('')}</div>`:`<div class="flags"><span class="flag ok">경고 플래그 없음</span></div>`;
  let h=`<h2>${esc(c.corp_name)}${rtBadge}</h2><div class="sub-title">${c.stock_code} · ${esc(c.market)}${c.sect_tp?' '+esc(c.sect_tp):''} · ${esc(c.sector_krx||'')} (KSIC ${esc(c.induty_code||'-')})${c.corp_name_full&&c.corp_name_full!==c.corp_name?' · '+esc(c.corp_name_full):''}</div>`;
  h+=flagStrip;
  h+=`<div class="tiles">
    <div class="tile"><div class="k">시가총액</div><div class="v">${억(ps.mcap)}<small>억</small></div><div class="d">${ps.asof||''}</div></div>
    <div class="tile"><div class="k">매출액 (${last.label||last.bsns_year||'-'}, ${d.kpi.CFS?'연결':'별도'})</div><div class="v">${억(last.revenue)}<small>억</small></div><div class="d">영업이익 ${억(last.op_income)}억</div></div>
    <div class="tile"><div class="k">부채비율 / 상환능력</div><div class="v">${pct(last.debt_ratio)}</div><div class="d">순차입금/EBITDA ${last.nd_ebitda!=null?last.nd_ebitda.toFixed(1)+'x':'-'} · 차입금의존도 ${pct(last.borrow_dep)} · 유동비율 ${pct(last.cur_ratio)}</div></div>
    <div class="tile"><div class="k">감사의견 ${ao?ao.bsns_year:''}</div><div class="v"><span class="pill ${opClass(ao&&ao.adt_opinion)}">${esc(ao?ao.adt_opinion:'-')}</span></div><div class="d">${esc(ao?ao.adtor:'')}</div></div>
    <div class="tile"><div class="k">1Y 수익률 / 60일 변동성</div><div class="v ${ps.chg_1y<0?'neg':''}">${pct(ps.chg_1y)}</div><div class="d">변동성 ${pct(ps.vol_60d)} · 거래대금 ${억(ps.avg_value_3m)}억/일</div></div>
    ${(()=>{const v=d.valuation; if(!v) return `<div class="tile"><div class="k">밸류에이션</div><div class="v">-</div><div class="d">시세·재무 필요</div></div>`;
      const x=n=>n==null?'N/A':n.toFixed(1)+'x'; return `<div class="tile"><div class="k">밸류에이션 (${esc(v.basis)}, ${v.fs})</div>
      <div class="v" style="font-size:15px;line-height:1.5">PER ${x(v.per)}${v.per==null?'<small>(적자)</small>':''} · PBR ${v.pbr==null?'N/A':v.pbr.toFixed(2)+'x'}<br>EV/${v.ev_basis||'EBITDA'} ${x(v.ev_ebitda)}${v.ev_basis==='영업이익'?' <small style="color:var(--warn)">영업이익 기준</small>':''}</div>
      <div class="d">EV ${억(v.ev)}억 = 시총 ${억(v.mcap)} + 순차입금 ${억(v.net_borrowings)}</div></div>`;})()}
  </div>`;
  // 1 개요
  h+=`<section><h3>1. 개요</h3><div class="kv">
    <b>대표이사</b><span>${esc(c.ceo_nm||'-')}</span><b>설립일</b><span>${esc(c.est_dt||'-')}</span>
    <b>상장일</b><span>${esc(c.listed_dt||'-')}</span><b>결산월</b><span>${esc(c.acc_mt||'-')}월</span>
    <b>본점</b><span>${esc(c.adres||'-')}</span><b>홈페이지</b><span>${c.hm_url?`<a href="${esc(c.hm_url.startsWith('http')?c.hm_url:'https://'+c.hm_url)}" target="_blank" rel="noopener">${esc(c.hm_url)}</a>`:'-'}</span>
  </div>`;
  if(d.audit.length) h+=`<div class="twrap" style="margin-top:10px"><table><tr><th>연도</th><th>감사인</th><th>의견</th><th>강조사항</th><th>핵심감사사항</th></tr>${d.audit.map(a=>`<tr><td>${a.bsns_year}</td><td>${esc(a.adtor||'-')}</td><td><span class="pill ${opClass(a.adt_opinion)}">${esc(a.adt_opinion||'-')}</span></td><td>${esc(a.emphs_matter||'-')}</td><td>${esc(a.core_adt_matter||'-')}</td></tr>`).join('')}</table></div>`;
  if((d.ratings||[]).length){ h+=`<div class="src" style="margin-top:12px">신용등급 추이 (최근 3년, 금감원 신용평가서 공시)</div><div class="twrap"><table><tr><th>공시일</th><th>평가사</th><th>평가대상</th><th>구분</th><th>등급</th><th>전망/감시</th></tr>${d.ratings.slice(0,15).map(r=>`<tr><td>${r.disc_dt}</td><td>${esc(r.agency)}</td><td>${esc(r.target_type||'')}</td><td>${esc(r.eval_kind||'')}</td><td><b>${esc(r.grade)}</b></td><td>${esc([r.outlook,r.watch].filter(Boolean).join(' / ')||'-')}</td></tr>`).join('')}</table></div>`; }
  else if(d.rating_text){ h+=`<div class="src" style="margin-top:12px">신용등급 — 공시 등급 없음 · 사업보고서 '신용평가에 관한 사항' 발췌</div><div class="summary" style="font-size:13px">${esc(d.rating_text.slice(0,1500))}</div>`; }
  const sh=d.shareholders||{};
  if((sh.top||[]).length){ h+=`<div class="src" style="margin-top:12px">주요 주주 (${sh.year} 사업보고서 기준, 지분율 상위 5명 · 최대주주측 ${sh.n}명)</div>
    <div class="twrap"><table><tr><th>주주</th><th>구분</th><th class="n">주식수</th><th class="n">지분율</th></tr>${sh.top.map(r=>`<tr><td>${esc(r.nm)}</td><td>${r.ins?esc(r.relate):`<span class="pill">${esc(r.relate)}</span>`}</td><td class="n">${num(r.co)}</td><td class="n">${pct(r.rt)}</td></tr>`).join('')}
    <tr style="font-weight:600;background:var(--bg)"><td>최대주주 및 특수관계인 합계</td><td></td><td class="n">${num(sh.total&&sh.total.co)}</td><td class="n">${pct(sh.total&&sh.total.rt)}</td></tr>
    ${d.minor?`<tr><td>소액주주 (${num(d.minor.shrholdr_co)}명)</td><td></td><td class="n">${num(d.minor.hold_stock_co)}</td><td class="n">${pct(d.minor.hold_stock_rate)}</td></tr>`:''}</table></div>`; }
  h+=`</section>`;
  // 2 사업내용
  const b=d.business, rs=d.rating_summary, s=rs?rs.summary:b.summary;
  h+=`<section><h3>2. 사업내용 ${rs?`(${esc(rs.agency)} 신용평가서 ${rs.disc_dt}, ${esc(rs.grade)})`:b.year?`(${b.year} 사업보고서)`:''}</h3>`;
  if(rs&&s){h+=`<div class="kv" style="grid-template-columns:max-content 1fr;max-width:90ch">
    <b>업종</b><span>${esc(s.industry)}</span><b>사업모델</b><span>${esc(s.business_model)}</span>
    <b>주요제품</b><span>${(s.main_products||[]).map(p=>`${esc(p.name)}${p.revenue_share_pct!=null?` (${p.revenue_share_pct}%)`:''}`).join(', ')||'-'}</span>
    <b>시장지위</b><span>${esc(s.market_position||'-')}</span><b>계열 지원</b><span>${esc(s.group_support||'-')}</span>
    <b>재무 평가 요지</b><span>${esc(s.key_financials_view||'-')}</span></div>
    <p style="margin:12px 0 4px;font-weight:500">등급 논리</p><ul>${(s.rating_rationale||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
    <div class="kv" style="grid-template-columns:max-content 1fr;max-width:90ch"><b style="color:var(--good)">상향 요인</b><span>${esc((s.rating_triggers&&s.rating_triggers.up||[]).join(' · ')||'-')}</span><b style="color:var(--bad)">하향 요인</b><span>${esc((s.rating_triggers&&s.rating_triggers.down||[]).join(' · ')||'-')}</span></div>
    <p style="margin:12px 0 4px;font-weight:500">심사상 유의 리스크</p><ul>${(s.key_risks||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
    <div class="summary">${esc(s.summary_md||'')}</div>
    <div class="src" style="margin-top:8px">출처: <a href="${esc(rs.file_url)}" target="_blank" rel="noopener">${esc(rs.agency)} 신용평가서 (금감원 공시)</a></div>`;}

function toWeekly(p){ // 주봉 집계: ISO 주 단위
  const out=[]; let cur=null, key=null;
  for(const [dt,o,h,l,c,v] of p){ const d=new Date(dt); const k=`${d.getFullYear()}-${Math.floor((d-new Date(d.getFullYear(),0,1))/864e5/7)}`;
    if(k!==key){ if(cur) out.push(cur); cur=[dt,o,h,l,c,v]; key=k; } else { cur[2]=Math.max(cur[2],h); cur[3]=Math.min(cur[3],l); cur[4]=c; cur[5]+=v; } }
  if(cur) out.push(cur); return out;
}
function drawChart(p){
  const cv=$('#px'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=260; cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement), mute=cs.getPropertyValue('--mute').trim(), line=cs.getPropertyValue('--line').trim();
  const UP='#d7342b', DN='#1f5fc4';   // 한국식: 상승 빨강, 하락 파랑
  if(p.length>300) p=toWeekly(p);
  const padL=58,padR=10,padT=10,padB=22,volH=50, chartB=H-padB-volH-6;
  const his=p.map(x=>x[2]), los=p.map(x=>x[3]); const lo=Math.min(...los), hi=Math.max(...his); const maxV=Math.max(...p.map(x=>x[5]))||1;
  const n=p.length, slot=(W-padL-padR)/n, bw=Math.max(1,Math.min(10,slot*0.65));
  const X=i=>padL+slot*(i+0.5), Y=v=>padT+(chartB-padT)*(1-(v-lo)/((hi-lo)||1));
  ctx.font='11px '+cs.getPropertyValue('--mono'); ctx.fillStyle=mute; ctx.strokeStyle=line; ctx.lineWidth=1;
  for(const v of [lo,(lo+hi)/2,hi]){const y=Y(v);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();ctx.textAlign='right';ctx.fillText(Math.round(v).toLocaleString(),padL-6,y+4)}
  ctx.textAlign='center'; [0,Math.floor(n/2),n-1].forEach(i=>ctx.fillText(p[i][0].slice(2),X(i),H-6));
  p.forEach((x,i)=>{ const [dt,o,h,l,c,v]=x; const up=c>=o; const col=up?UP:DN; const cx=X(i);
    ctx.fillStyle=col; ctx.globalAlpha=.35; ctx.fillRect(cx-bw/2, chartB+6+volH*(1-v/maxV), bw, volH*(v/maxV)); ctx.globalAlpha=1;   // 거래량
    ctx.strokeStyle=col; ctx.beginPath(); ctx.moveTo(cx,Y(h)); ctx.lineTo(cx,Y(l)); ctx.stroke();                                    // 꼬리
    const top=Y(Math.max(o,c)), bot=Y(Math.min(o,c)); const bh=Math.max(1,bot-top);
    if(up){ ctx.fillStyle=cs.getPropertyValue('--panel').trim(); ctx.fillRect(cx-bw/2,top,bw,bh); ctx.strokeRect(cx-bw/2+.5,top+.5,bw-1,bh-1); } else { ctx.fillStyle=col; ctx.fillRect(cx-bw/2,top,bw,bh); }
  });
  ctx.fillStyle=mute; ctx.textAlign='left'; ctx.fillText(p.length>260||slot<3?'주봉':'일봉', padL+4, padT+10);
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(/^\d{6}$/.test(h)&&h!==cur)open(h)});
