<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코스닥 심사참고 DB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 좌측 고정 검색 패널 + 우측 프로필. 공시 열람 도구의 밀도, 장식 없음 */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#1b1f1d; --mute:#6b716e; --line:#dcdfdb;
  --accent:#1f5f8b; --accent-bg:#e8f0f6; --good:#2e7d4f; --warn:#b26a00; --bad:#b3261e;
  --g1:#eef3f8; --g2:#f7f2ea; --g3:#eef5ef;   /* 손익 / 자산부채자본 / 재무지표 음영 */
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181a;--panel:#1d2124;--fg:#e6e8e6;--mute:#9aa19d;--line:#2f3539;--accent:#6fb1e0;--accent-bg:#1e2f3c;--good:#6cc08f;--warn:#e0a53a;--bad:#f07a73;--g1:#1c252e;--g2:#262220;--g3:#1d2823;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--font);display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;font-weight:600;margin:0}
header .meta{color:var(--mute);font-size:12px;font-family:var(--mono)}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside .search{padding:12px;border-bottom:1px solid var(--line)}
aside input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit}
aside input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
#list{overflow:auto;flex:1;min-height:0}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover,.row.on{background:var(--accent-bg)}
.row .nm{font-weight:500}
.row .cd{font-family:var(--mono);color:var(--mute);font-size:12px}
.row .sub{grid-column:1/-1;font-size:12px;color:var(--mute);display:flex;gap:10px}
main{overflow:auto;min-width:0;padding:18px 22px 40px}
.empty{color:var(--mute);padding:40px 0;max-width:60ch}
h2{font-size:22px;margin:0 0 2px;font-weight:600}
.sub-title{color:var(--mute);font-family:var(--mono);font-size:13px;margin-bottom:16px}
section{margin-bottom:26px}
section>h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.tile .k{font-size:11px;color:var(--mute);letter-spacing:.03em}
.tile .v{font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;color:var(--mute);margin-left:2px}
.tile .d{font-size:11px;color:var(--mute);font-family:var(--mono)}
.twrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px}
tr.g1>td,tr.g1>th{background:var(--g1)} tr.g2>td,tr.g2>th{background:var(--g2)} tr.g3>td,tr.g3>th{background:var(--g3)}
td.sep,th.sep{border-left:2px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:top}
.kv{display:grid;grid-template-columns:max-content 1fr max-content 1fr;gap:4px 14px;font-size:13px}
.kv b{color:var(--mute);font-weight:500}
.pill{display:inline-block;padding:1px 7px;border-radius:3px;font-size:12px;font-family:var(--mono);border:1px solid var(--line)}
.pill.good{color:var(--good);border-color:var(--good)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)}
.neg{color:var(--bad)}
.summary{max-width:72ch;white-space:pre-wrap}
.summary ul{margin:6px 0;padding-left:18px}
.src{font-size:12px;color:var(--mute)} .src a{color:var(--accent)}
canvas{width:100%;height:160px;display:block;background:var(--panel);border:1px solid var(--line)}
a{color:var(--accent)}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}aside{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}main{padding:14px 16px}}
</style>
</head>
<body>
<header><h1>코스닥 심사참고 DB</h1><span class="meta" id="meta">불러오는 중</span></header>
<aside>
  <div class="search"><input id="q" placeholder="회사명 · 종목코드 · 업종" autocomplete="off"><div class="hint" id="cnt"></div></div>
  <div id="list"></div>
</aside>
<main id="main"><div class="empty">왼쪽에서 종목을 고르세요. 재무는 DART 사업보고서(연결 우선), 주가는 KRX 일별시세 기준이며 심사 참고용 요약입니다. 원문은 각 항목의 DART 링크로 확인하세요.</div></main>
<script>
const $=s=>document.querySelector(s);
const 억=v=>v==null?'-':(v/1e8).toLocaleString('ko-KR',{maximumFractionDigits:0});
const pct=v=>v==null?'-':v.toFixed(1)+'%';
const num=v=>v==null?'-':Math.round(Number(v)).toLocaleString('ko-KR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let items=[],cur=null;

fetch('data/companies.json').then(r=>r.json()).then(j=>{
  items=j.items; $('#meta').textContent=`${j.meta.count}개사 · 빌드 ${j.meta.built_at}` + (j.meta.price_asof?` · 시세 ${j.meta.price_asof}`:'');
  render(items); const h=location.hash.slice(1); if(/^\d{6}$/.test(h)) open(h);
});
$('#q').addEventListener('input',e=>{
  const t=e.target.value.trim().toLowerCase();
  render(t?items.filter(i=>(i.name+' '+i.code+' '+(i.sector||'')+' '+(i.industry||'')).toLowerCase().includes(t)):items);
});
function render(list){
  $('#cnt').textContent=`${list.length}개`;
  $('#list').innerHTML=list.slice(0,300).map(i=>`<div class="row${cur===i.code?' on':''}" data-c="${i.code}">
    <span class="nm">${esc(i.name)}</span><span class="cd">${i.code}</span>
    <span class="sub"><span>${esc(i.sector||'')}</span><span>매출 ${억(i.rev)}억</span><span>부채비율 ${pct(i.debt)}</span>${i.opinion&&i.opinion!=='적정'?`<span class="neg">${esc(i.opinion)}</span>`:''}</span></div>`).join('')
    +(list.length>300?'<div class="row"><span class="cd">상위 300개만 표시 · 검색어를 좁히세요</span></div>':'');
}
$('#list').addEventListener('click',e=>{const r=e.target.closest('.row');if(r&&r.dataset.c)open(r.dataset.c)});

async function open(code){
  cur=code; location.hash=code; document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',r.dataset.c===code));
  const d=await fetch(`data/c/${code}.json`).then(r=>r.json()).catch(()=>null);
  if(!d){$('#main').innerHTML='<div class="empty">상세 데이터가 없습니다.</div>';return}
  const c=d.company, ps=d.price_summary||{}, kp=d.kpi.CFS||d.kpi.OFS||[], last=[...kp].reverse().find(r=>r.kind==='annual')||kp[kp.length-1]||{}, ao=d.audit[0];
  const opClass=o=>!o?'':o==='적정'?'good':/한정/.test(o)?'warn':'bad';
  let h=`<h2>${esc(c.corp_name)}</h2><div class="sub-title">${c.stock_code} · ${esc(c.market)}${c.sect_tp?' '+esc(c.sect_tp):''} · ${esc(c.sector_krx||'')} (KSIC ${esc(c.induty_code||'-')})${c.corp_name_full&&c.corp_name_full!==c.corp_name?' · '+esc(c.corp_name_full):''}</div>`;
  h+=`<div class="tiles">
    <div class="tile"><div class="k">시가총액</div><div class="v">${억(ps.mcap)}<small>억</small></div><div class="d">${ps.asof||''}</div></div>
    <div class="tile"><div class="k">매출액 (${last.label||last.bsns_year||'-'}, ${d.kpi.CFS?'연결':'별도'})</div><div class="v">${억(last.revenue)}<small>억</small></div><div class="d">영업이익 ${억(last.op_income)}억</div></div>
    <div class="tile"><div class="k">부채비율</div><div class="v">${pct(last.debt_ratio)}</div><div class="d">차입금의존도 ${pct(last.borrow_dep)}</div></div>
    <div class="tile"><div class="k">감사의견 ${ao?ao.bsns_year:''}</div><div class="v"><span class="pill ${opClass(ao&&ao.adt_opinion)}">${esc(ao?ao.adt_opinion:'-')}</span></div><div class="d">${esc(ao?ao.adtor:'')}</div></div>
    <div class="tile"><div class="k">1Y 수익률 / 60일 변동성</div><div class="v ${ps.chg_1y<0?'neg':''}">${pct(ps.chg_1y)}</div><div class="d">변동성 ${pct(ps.vol_60d)} · 거래대금 ${억(ps.avg_value_3m)}억/일</div></div>
  </div>`;
  // 1 개요
  h+=`<section><h3>1. 개요</h3><div class="kv">
    <b>대표이사</b><span>${esc(c.ceo_nm||'-')}</span><b>설립일</b><span>${esc(c.est_dt||'-')}</span>
    <b>상장일</b><span>${esc(c.listed_dt||'-')}</span><b>결산월</b><span>${esc(c.acc_mt||'-')}월</span>
    <b>본점</b><span>${esc(c.adres||'-')}</span><b>홈페이지</b><span>${c.hm_url?`<a href="${esc(c.hm_url.startsWith('http')?c.hm_url:'https://'+c.hm_url)}" target="_blank" rel="noopener">${esc(c.hm_url)}</a>`:'-'}</span>
  </div>`;
  if(d.audit.length) h+=`<div class="twrap" style="margin-top:10px"><table><tr><th>연도</th><th>감사인</th><th>의견</th><th>강조사항</th><th>핵심감사사항</th></tr>${d.audit.map(a=>`<tr><td>${a.bsns_year}</td><td>${esc(a.adtor||'-')}</td><td><span class="pill ${opClass(a.adt_opinion)}">${esc(a.adt_opinion||'-')}</span></td><td>${esc(a.emphs_matter||'-')}</td><td>${esc(a.core_adt_matter||'-')}</td></tr>`).join('')}</table></div>`;
  if(d.shareholders.length) h+=`<div class="twrap" style="margin-top:10px"><table><tr><th>최대주주·특수관계인</th><th>관계</th><th class="n">기말주식수</th><th class="n">지분율</th></tr>${d.shareholders.map(s=>`<tr><td>${esc(s.nm)}</td><td>${esc(s.relate||'-')}</td><td class="n">${num(s.trmend_posesn_stock_co)}</td><td class="n">${pct(s.trmend_posesn_stock_qota_rt)}</td></tr>`).join('')}</table></div>`;
  h+=`</section>`;
  // 2 사업내용
  const b=d.business, s=b.summary;
  h+=`<section><h3>2. 사업내용 ${b.year?`(${b.year} 사업보고서)`:''}</h3>`;
  if(s){h+=`<div class="kv" style="grid-template-columns:max-content 1fr;max-width:90ch">
    <b>업종</b><span>${esc(s.industry)}</span><b>사업모델</b><span>${esc(s.business_model)}</span>
    <b>주요제품</b><span>${(s.main_products||[]).map(p=>`${esc(p.name)}${p.revenue_share_pct!=null?` (${p.revenue_share_pct}%)`:''}`).join(', ')||'-'}</span>
    <b>주요고객</b><span>${esc((s.major_customers||[]).join(', ')||'-')}</span><b>거래처 집중도</b><span>${esc(s.customer_concentration||'-')}</span>
    <b>원재료·공급망</b><span>${esc(s.raw_material_supply||'-')}</span><b>경쟁환경</b><span>${esc(s.competition||'-')}</span>
    <b>생산·가동률</b><span>${esc(s.capacity_utilization||'-')}</span><b>신규사업</b><span>${esc(s.new_business||'-')}</span></div>
    <p style="margin:12px 0 4px;font-weight:500">심사상 유의 리스크</p><ul>${(s.key_risks||[]).map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
    <div class="summary">${esc(s.summary_md||'')}</div>`;}
  else if(b.overview) h+=`<div class="src">요약 미생성 · 사업보고서 '사업의 개요' 원문 발췌</div><div class="summary">${esc(b.overview)}</div>`;
  else h+=`<div class="src">사업내용 미수집</div>`;
  if(b.dart_url) h+=`<div class="src" style="margin-top:8px">원문: <a href="${b.dart_url}" target="_blank" rel="noopener">DART ${b.rcept_no}</a></div>`;
  h+=`</section>`;
  // 3 재무: 한 표에 좌측 별도 | 우측 연결 (각 연간 2개년 + 전년동기·최근분기)
  h+=`<section><h3>3. 재무현황 (억원, %)</h3>`;
  {
    const x=v=>v==null?'-':v.toFixed(1)+'x';
    const groups=[
      ['g1', [['매출액','revenue',억],['영업이익','op_income',억],['EBITDA','ebitda',억,'da'],['당기순이익','net_income',억],['영업활동CF','cfo',억]]],
      ['g2', [['자산총계','total_assets',억],['부채총계','total_liab',억],['자본총계','equity',억],['총차입금(근사)','borrowings',억],['현금성자산','cash',억],['순차입금','net_borrowings',억]]],
      ['g3', [['부채비율','debt_ratio',pct],['차입금의존도','borrow_dep',pct],['영업이익률','op_margin',pct],['EBITDA/이자비용','interest_cover',x]]],
    ];
    const bases=[['OFS','별도'],['CFS','연결']].filter(([fs])=>d.kpi[fs]&&d.kpi[fs].length);
    if(!bases.length) h+=`<div class="src">재무 미수집</div>`;
    else{
      const prevOf=(rows,i)=>{const r=rows[i]; if(r.kind==='annual'){const p=rows[i-1]; return p&&p.kind==='annual'?p:null;} if(r.kind==='interim'){const p=rows[i-1]; return p&&p.kind==='prev_interim'?p:null;} return null;};
      const chg=(cur,prev,f)=>{ if(cur==null||prev==null) return ''; let t; if(f===억){ if(prev<=0) return ''; const v=(cur/prev-1)*100; t=(v>0?'+':'')+v.toFixed(1)+'%'; } else if(f===pct){ const v=cur-prev; t=(v>0?'+':'')+v.toFixed(1)+'%p'; } else { if(prev===0) return ''; const v=(cur-prev)/Math.abs(prev)*100; t=(v>0?'+':'')+v.toFixed(1)+'%'; } return `<br><small style="color:${t.startsWith('-')?'var(--bad)':t.startsWith('+')?'var(--good)':'var(--mute)'}">${t}</small>`; };
      const cell=(rows,i,k,f,sub,first)=>{const r=rows[i],p=prevOf(rows,i); return `<td class="n${first?' sep':''} ${r[k]<0?'neg':''}">${f(r[k])}${sub?`<br><small style="color:var(--mute)">(${f(r[sub])})</small>`:chg(r[k],p&&p[k],f)}</td>`;};
      const head1=`<tr><th></th>${bases.map(([fs,nm])=>`<th class="sep" colspan="${d.kpi[fs].length}" style="text-align:center;font-weight:600;color:var(--fg)">${nm}</th>`).join('')}</tr>`;
      const head2=`<tr><th>항목</th>${bases.map(([fs])=>d.kpi[fs].map((r,i)=>`<th class="n${i===0?' sep':''}" ${r.kind==='interim'?'style="border-bottom:2px solid var(--accent)"':''}>${r.label||r.bsns_year}</th>`).join('')).join('')}</tr>`;
      const body=groups.map(([cls,cols])=>cols.map(([n,k,f,sub])=>`<tr class="${cls}"><td>${n}${sub?'<br><small style="color:var(--mute)">(유무형상각비)</small>':''}</td>${bases.map(([fs])=>d.kpi[fs].map((r,i)=>cell(d.kpi[fs],i,k,f,sub,i===0)).join('')).join('')}</tr>`).join('')).join('');
      h+=`<div class="src" style="margin:6px 0 4px">억원 · 연간 2개년 + 전년동기·최근분기(누적) · 작은 글씨는 전년(동기)대비 증감(금액·배수 %, 비율 %p) · 음영: 손익 / 자산·부채·자본 / 재무지표</div><div class="twrap"><table>${head1}${head2}${body}</table></div>`;
    }
  }
  h+=`</section>`;
  // 4 주가
  h+=`<section><h3>4. 주가추이 · 담보가치 참고</h3>`;
  if(d.prices.length){h+=`<canvas id="px"></canvas><div class="kv" style="margin-top:10px">
    <b>기준일</b><span>${ps.asof||'-'}</span><b>종가</b><span>${num(ps.close)}원</span>
    <b>52주 고/저</b><span>${num(ps.high_52w)} / ${num(ps.low_52w)}</span><b>발행주식수</b><span>${num(ps.shares_out)}</span>
    <b>1M / 3M / 1Y</b><span>${pct(ps.chg_1m)} / ${pct(ps.chg_3m)} / ${pct(ps.chg_1y)}</span><b>3M 평균거래량</b><span>${num(Math.round(ps.avg_vol_3m||0))}주</span></div>`;}
  else h+=`<div class="src">주가 미수집</div>`;
  h+=`</section>`;
  // 5 공시
  h+=`<section><h3>5. 주요 공시 (심사 키워드 필터)</h3>`;
  h+=d.events.length?`<div class="twrap"><table><tr><th>일자</th><th>구분</th><th>공시명</th></tr>${d.events.map(e=>`<tr><td>${e.rcept_dt}</td><td><span class="pill">${esc(e.flag)}</span></td><td><a href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${e.rcept_no}" target="_blank" rel="noopener">${esc(e.report_nm)}</a></td></tr>`).join('')}</table></div>`:`<div class="src">해당 없음 / 미수집</div>`;
  h+=`</section>`;
  // 6 리포트 (메타 + 추출 수치·자체 요약만. 원문 미포함)
  h+=`<section><h3>6. 증권사 리포트 · 분석</h3>`;
  if(d.reports.length){
    h+=`<div class="twrap"><table><tr><th>일자</th><th>증권사 / 애널리스트</th><th>제목</th><th>의견</th><th class="n">목표가</th></tr>${d.reports.map(r=>`<tr><td>${r.pub_dt}</td><td>${esc(r.publisher||'-')}${r.analyst?` / ${esc(r.analyst)}`:''}</td><td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></td><td>${esc(r.opinion||'-')}</td><td class="n">${num(r.target_price)}${r.old_target_price&&r.old_target_price!==r.target_price?`<br><small style="color:var(--mute)">← ${num(r.old_target_price)}</small>`:''}</td></tr>`).join('')}</table></div>`;
    const fva=d.forecast_vs_actual||[];
    if(fva.length){h+=`<div class="src" style="margin:12px 0 4px">전망 vs 실적 (억원, 달성률)</div><div class="twrap"><table><tr><th>발행</th><th>증권사</th><th>대상연도</th><th class="n">매출 전망</th><th class="n">실제</th><th class="n">달성</th><th class="n">영업이익 전망</th><th class="n">실제</th><th class="n">달성</th></tr>${fva.map(f=>`<tr><td>${f.pub_dt}</td><td>${esc(f.publisher||'')}</td><td>${f.year}</td><td class="n">${억(f.f_rev)}</td><td class="n">${억(f.a_rev)}</td><td class="n ${f.ach_rev!=null&&f.ach_rev<90?'neg':''}">${pct(f.ach_rev)}</td><td class="n">${억(f.f_op)}</td><td class="n">${억(f.a_op)}</td><td class="n ${f.ach_op!=null&&f.ach_op<80?'neg':''}">${pct(f.ach_op)}</td></tr>`).join('')}</table></div>`;}
    for(const r of d.reports.filter(r=>r.memo_md).slice(0,3)){
      const pts=JSON.parse(r.points_json||'[]'), rk=JSON.parse(r.risks_json||'[]'), va=JSON.parse(r.valuation_json||'null');
      h+=`<div style="margin-top:14px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);max-width:90ch"><div class="src">${r.pub_dt} · ${esc(r.publisher)} ${va&&va.method?`· 밸류에이션 ${esc(va.method)}${va.multiple?` ${va.multiple}x`:''}`:''}</div>
        <div class="summary" style="margin:6px 0">${esc(r.memo_md)}</div>
        ${pts.length?`<div class="src">투자포인트</div><ul style="margin:2px 0 6px;padding-left:18px">${pts.map(p=>`<li>${esc(p.point)}${p.evidence?` <span class="src">(${esc(p.evidence)})</span>`:''}</li>`).join('')}</ul>`:''}
        ${rk.length?`<div class="src">리스크</div><ul style="margin:2px 0;padding-left:18px">${rk.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`;}
  } else h+=`<div class="src">커버리지 없음 / 미수집</div>`;
  h+=`</section>`;
  $('#main').innerHTML=h; $('#main').scrollTop=0;
  if(d.prices.length) drawChart(d.prices);
}
function drawChart(p){
  const cv=$('#px'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=160; cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement), acc=cs.getPropertyValue('--accent').trim(), mute=cs.getPropertyValue('--mute').trim(), line=cs.getPropertyValue('--line').trim();
  const vals=p.map(x=>x[1]), lo=Math.min(...vals), hi=Math.max(...vals), padL=56,padR=10,padT=10,padB=22;
  const X=i=>padL+(W-padL-padR)*i/(p.length-1), Y=v=>padT+(H-padT-padB)*(1-(v-lo)/((hi-lo)||1));
  ctx.font='11px '+cs.getPropertyValue('--mono'); ctx.fillStyle=mute; ctx.strokeStyle=line; ctx.lineWidth=1;
  for(const v of [lo,(lo+hi)/2,hi]){const y=Y(v);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();ctx.textAlign='right';ctx.fillText(Math.round(v).toLocaleString(),padL-6,y+4)}
  ctx.textAlign='center'; [0,Math.floor(p.length/2),p.length-1].forEach(i=>ctx.fillText(p[i][0].slice(2),X(i),H-6));
  ctx.beginPath(); p.forEach((x,i)=>i?ctx.lineTo(X(i),Y(x[1])):ctx.moveTo(X(i),Y(x[1])));
  ctx.strokeStyle=acc; ctx.lineWidth=1.5; ctx.stroke();
  ctx.lineTo(X(p.length-1),H-padB); ctx.lineTo(X(0),H-padB); ctx.closePath(); ctx.fillStyle=acc; ctx.globalAlpha=.12; ctx.fill(); ctx.globalAlpha=1;
  const e=p[p.length-1]; ctx.fillStyle=acc; ctx.beginPath(); ctx.arc(X(p.length-1),Y(e[1]),3,0,7); ctx.fill();
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(/^\d{6}$/.test(h)&&h!==cur)open(h)});
</script>
